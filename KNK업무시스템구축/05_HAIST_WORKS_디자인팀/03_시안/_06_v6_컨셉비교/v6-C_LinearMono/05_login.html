<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8" /><title>v6-C LinearMono · /login</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
<style>
:root { --bg:#FFFFFF; --paper-2:#FAFAFA; --paper-3:#F4F4F5; --ink:#000000; --ink-soft:#18181B; --mute:#71717A; --line:#E4E4E7; --line-strong:#A1A1AA; --knk:#A5282C; --indigo:#5E6AD2; --indigo-soft:#EEF0FB; --sidebar-bg:#0A0A0A; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',-apple-system,sans-serif;font-size:14px;color:var(--ink-soft);background:var(--bg);min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.left{background:var(--sidebar-bg);color:white;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.left::before{content:"";position:absolute;top:-30%;right:-30%;width:80%;height:80%;background:radial-gradient(circle,var(--indigo) 0%,transparent 70%);opacity:.3}
.brand{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.brand img{height:24px;filter:brightness(0) invert(1)}
.brand-name{font-size:14px;font-weight:600}
.brand-v{font-size:10px;background:var(--indigo);padding:2px 6px;border-radius:3px;margin-left:6px;font-weight:700;letter-spacing:.04em}
.welcome{position:relative;z-index:1}
.welcome-up{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--indigo);font-weight:700;font-family:'JetBrains Mono',monospace}
.welcome h1{font-size:42px;font-weight:700;letter-spacing:-.025em;margin-top:16px;line-height:1.2}
.welcome p{font-size:14px;color:rgba(255,255,255,.6);margin-top:14px;line-height:1.7;max-width:380px}
.stats{position:relative;z-index:1;display:flex;gap:24px}
.stat{flex:1}
.stat-num{font-size:24px;font-weight:700;color:white;font-family:'JetBrains Mono',monospace}
.stat-lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-top:2px;font-family:'JetBrains Mono',monospace}
.right{padding:48px;display:flex;flex-direction:column;justify-content:center;max-width:480px;margin:0 auto;width:100%}
.label-up{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--indigo);font-weight:700;font-family:'JetBrains Mono',monospace;margin-bottom:8px}
.title{font-size:30px;font-weight:700;letter-spacing:-.025em;color:var(--ink);margin-bottom:8px;line-height:1.2}
.sub{font-size:14px;color:var(--mute);margin-bottom:36px;line-height:1.6}
.field{margin-bottom:18px}
.field label{display:block;font-size:11px;font-weight:600;margin-bottom:6px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.04em}
.field input{width:100%;padding:11px 14px;border:1px solid var(--line-strong);border-radius:6px;font-family:inherit;font-size:14px;background:var(--bg)}
.field input:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(94,106,210,.15)}
.field-row{display:flex;justify-content:space-between;align-items:center;margin:14px 0 24px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);cursor:pointer}
.check input{accent-color:var(--indigo);width:14px;height:14px}
.link{font-size:13px;color:var(--indigo);font-weight:600;cursor:pointer;text-decoration:none}
.link:hover{color:var(--knk)}
.btn-primary{width:100%;padding:12px;background:var(--ink);color:white;border:0;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;justify-content:center;align-items:center;gap:8px}
.btn-primary:hover{background:var(--knk)}
.btn-primary .kbd{font-family:'JetBrains Mono',monospace;background:rgba(255,255,255,.15);padding:1px 6px;border-radius:3px;font-size:10px;font-weight:500}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-family:'JetBrains Mono',monospace}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.btn-sso{width:100%;padding:11px;background:var(--bg);border:1px solid var(--line-strong);border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink)}
.btn-sso:hover{border-color:var(--ink)}
.footer{margin-top:36px;font-size:11px;color:var(--mute);line-height:1.6;font-family:'JetBrains Mono',monospace}
.footer b{color:var(--ink)}
@media (max-width:768px){body{grid-template-columns:1fr}.left{display:none}}
</style></head><body>
<div class="left">
<div class="brand"><img src="../../../../../01_HAIST_WORKS/static/logo.png" alt="KNK"/><div class="brand-name">HAIST WORKS<span class="brand-v">v6-C</span></div></div>
<div class="welcome">
<div class="welcome-up">// SIGN IN</div>
<h1>Built for<br>industrial<br>operations.</h1>
<p>케이엔케이 통합 업무 플랫폼.<br>김 부장님께 빅터 AI가 오늘의 견적·발주·재고 알림을 준비했습니다.</p>
</div>
<div class="stats">
<div class="stat"><div class="stat-num">23</div><div class="stat-lbl">in_progress</div></div>
<div class="stat"><div class="stat-num">8</div><div class="stat-lbl">pending_po</div></div>
<div class="stat"><div class="stat-num">3</div><div class="stat-lbl">stock_alert</div></div>
</div>
</div>
<div class="right">
<div class="label-up">// LOGIN</div>
<h1 class="title">반갑습니다</h1>
<p class="sub">사번 또는 사내 이메일로 로그인하세요</p>
<div class="field"><label>// employee_id</label><input value="knk2024"/></div>
<div class="field"><label>// password</label><input type="password" value="••••••••"/></div>
<div class="field-row">
<label class="check"><input type="checkbox" checked/> 로그인 유지</label>
<a class="link">비밀번호 찾기 →</a>
</div>
<button class="btn-primary">로그인 <span class="kbd">↵</span></button>
<div class="divider">// or</div>
<button class="btn-sso">🔒 SSO 통합 로그인</button>
<div class="footer">// ㈜케이엔케이 · HAIST Innovation<br>// support: <b>02-3142-XXXX</b></div>
</div>
</body></html>
