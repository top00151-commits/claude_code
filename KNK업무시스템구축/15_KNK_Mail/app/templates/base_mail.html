<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="{{ theme_color }}">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <style>
    :root{ --knk:{{ theme_color }}; --bg:#f4f5f7; --line:#e3e5e9; --ink:#1f2430; --mut:#6b7280; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;
          background:var(--bg); color:var(--ink); }
    .mhead{ position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px;
            height:48px; padding:0 14px; background:var(--knk); color:#fff; }
    .mhead .brand{ font-weight:700; font-size:15px; letter-spacing:.2px; }
    .mhead .sp{ flex:1; }
    .mhead a{ color:#fff; text-decoration:none; opacity:.92; font-size:13px; }
    .mhead a:hover{ opacity:1; }
    .wrap{ max-width:1180px; margin:0 auto; padding:16px; }
    .card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px; }
    .muted{ color:var(--mut); }
    .btn{ display:inline-block; background:var(--knk); color:#fff; border:0; border-radius:8px;
          padding:9px 16px; font-size:14px; cursor:pointer; text-decoration:none; }
    .pill{ display:inline-block; font-size:11px; padding:1px 8px; border-radius:999px;
           background:#eef0f3; color:var(--mut); }
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body>
  <header class="mhead">
    <span class="brand">📧 {{ app_name }}</span>
    <span class="sp"></span>
    {% if user and user.name %}
      <span style="font-size:12px;opacity:.9;">{{ user.name }}</span>
      <a href="/logout">로그아웃</a>
    {% endif %}
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
