; KNK Eum MAIL — supervisor 프로그램 (Synology NAS, 메신저와 동일 방식)
; 경로(/volume1/...)는 실제 설치 경로로 바꾸세요. supervisor 디렉터리에 두고 reread+update.
[program:knk-eum-mail]
command=/bin/sh /volume1/web/knk-eum-mail/deploy/run_prod.sh
directory=/volume1/web/knk-eum-mail
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stdout_logfile=/var/log/knk-eum-mail.out.log
stderr_logfile=/var/log/knk-eum-mail.err.log
; 환경값은 deploy/.env 에서 run_prod.sh 가 로드합니다(여기 중복 불필요).
