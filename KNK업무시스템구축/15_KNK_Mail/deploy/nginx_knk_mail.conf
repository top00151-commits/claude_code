# KNK Eum MAIL — nginx vhost (메신저 컨테이너 내부)
# ============================================================
# 적용 위치(컨테이너 안): /etc/nginx/conf.d/knk-mail.conf  (conf.d 는 nginx.conf 가 include)
# 적용:   nginx -t  &&  nginx -s reload
# 롤백:   rm /etc/nginx/conf.d/knk-mail.conf  &&  nginx -s reload
#
# 안전성(검증 워크플로우 3개 리뷰 만장일치 GO, 2026-06-14):
#  · 새 server 블록(server_name mail.knknara.co.kr)만 추가 → 기존 default_server `_`(메신저/WORKS) 무영향
#  · listen 8080 은 기존과 동일 포트, server_name 으로만 분기 → Host 헤더가 mail 일 때만 이 블록
#  · mail 앱은 루트 경로 서비스(/login,/sso/land,/mail/inbox,/static,/dl) → WORKS 의 /works/ 같은
#    sub_filter 경로재작성 불필요(루트앱). proxy_pass 끝에 / 없음(전체 경로 보존).
#
# 적용 후 검증(컨테이너 안):
#   nginx -T | grep 'server_name mail.knknara.co.kr'                          # 포함 확인
#   curl -s -H 'Host: mail.knknara.co.kr' http://127.0.0.1:8080/healthz       # → 메일 JSON
#   curl -s -o /dev/null -w '%{http_code}' -H 'Host: haist.knknara.co.kr' \
#        http://127.0.0.1:8080/login                                          # → 메신저(기본서버 무영향 확인)
#
# 외부 노출 완성에 추가로 필요(DSM GUI, 사람):
#   1) DNS  mail.knknara.co.kr → NAS (works.와 동일)
#   2) DSM 리버스 프록시  mail.knknara.co.kr(443) → 컨테이너:8080  (Host 보존)
#   3) SSL 인증서  mail.knknara.co.kr
# ============================================================
server {
    listen 8080;
    listen [::]:8080;
    server_name mail.knknara.co.kr;
    client_max_body_size 600M;
    location / {
        proxy_pass http://127.0.0.1:8201;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
