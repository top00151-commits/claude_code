<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KNK 시스템 사용 흐름도 — 2026-05-21</title>
<style>
  :root {
    --ink:#1f2937; --ink-2:#4b5563; --ink-3:#9ca3af;
    --line:#e5e7eb; --bg:#fafafa; --knk-red:#a5282c; --accent:#6366f1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}

  .topbar{
    position:sticky;top:0;z-index:50;background:#fff;border-bottom:2px solid var(--knk-red);
    padding:14px 24px;display:flex;align-items:center;gap:18px;box-shadow:0 2px 8px rgba(0,0,0,.04);
  }
  .brand{font-size:18px;font-weight:800;color:var(--knk-red);letter-spacing:-.5px}
  .brand-sub{font-size:12px;color:var(--ink-3);margin-left:6px}
  .grow{flex:1}
  .fbtn{padding:7px 13px;font-size:12.5px;font-weight:700;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink-2);cursor:pointer;transition:.15s}
  .fbtn:hover{border-color:var(--accent);color:var(--accent)}
  .fbtn.on{background:var(--knk-red);border-color:var(--knk-red);color:#fff}

  .layout{display:flex;min-height:calc(100vh - 62px)}
  .canvas-wrap{flex:1;position:relative;overflow:auto;padding:24px;background:linear-gradient(180deg,#fff 0%,#f5f5f5 100%)}
  .side{
    width:340px;border-left:1px solid var(--line);background:#fff;padding:20px;
    position:sticky;top:62px;height:calc(100vh - 62px);overflow-y:auto;
  }

  /* SVG 캔버스 */
  #stage-svg{position:absolute;inset:0;pointer-events:none;z-index:1}
  .stage-area{position:relative;z-index:2}

  /* 6 단계 컬럼 */
  .stages{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:32px;}
  @media (max-width:1300px){.stages{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:850px){.stages{grid-template-columns:1fr}}

  .stage-col{display:flex;flex-direction:column;gap:10px;min-height:300px}
  .stage-head{
    background:linear-gradient(135deg,var(--knk-red) 0%,#7c2128 100%);color:#fff;
    padding:10px 12px;border-radius:10px;font-weight:800;text-align:center;font-size:13.5px;letter-spacing:-.2px;
    box-shadow:0 2px 6px rgba(165,40,44,.25);
  }
  .stage-head small{display:block;font-weight:500;font-size:10.5px;opacity:.9;margin-top:2px;letter-spacing:.04em}

  /* 화면 카드 */
  .screen{
    background:#fff;border:1.5px solid var(--line);border-left-width:5px;border-radius:10px;
    padding:10px 12px;cursor:pointer;transition:all .15s;position:relative;
  }
  .screen:hover{transform:translateX(2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
  .screen.hub-tot{border-left-color:#7c3aed}
  .screen.hub-sales{border-left-color:#dc2626}
  .screen.hub-logi{border-left-color:#16a34a}
  .screen.hub-wf{border-left-color:#0369a1}
  .screen.hub-admin{border-left-color:#6b7280}
  .screen.hub-msg{border-left-color:#ca8a04}
  .screen.selected{box-shadow:0 0 0 3px var(--knk-red);transform:translateX(4px)}
  .screen.dim{opacity:.25}

  .screen .ic{font-size:18px;margin-right:5px}
  .screen .name{font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:4px}
  .screen .url{font-size:10.5px;font-family:monospace;color:var(--ink-3);margin-top:2px}
  .screen .auto-tag{
    position:absolute;top:6px;right:6px;font-size:9px;
    background:#fef3c7;color:#92400e;padding:1px 5px;border-radius:4px;font-weight:700;
  }
  .screen .auto-tag.auto{background:#dcfce7;color:#166534}

  /* 횡단 메뉴 (하단 가로 바) */
  .cross-band{
    background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-top:8px;
  }
  .cross-band h3{font-size:13px;color:var(--ink-2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .cross-band h3 small{font-size:10.5px;color:var(--ink-3);font-weight:500}
  .cross-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}

  /* 옆 패널 */
  .side h2{font-size:17px;color:var(--ink);margin-bottom:4px;display:flex;align-items:center;gap:6px}
  .side .sub{font-size:11.5px;color:var(--ink-3);margin-bottom:14px}
  .scard{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:13px;margin-bottom:10px}
  .scard h4{font-size:11px;color:var(--ink-3);margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase}
  .scard p{font-size:12.5px;color:var(--ink);line-height:1.55}
  .scard .url-pill{
    display:inline-block;padding:5px 11px;background:#1e40af;color:#fff;border-radius:6px;
    font-family:monospace;font-size:11px;font-weight:700;text-decoration:none;
  }
  .scard .url-pill:hover{background:#1e3a8a}

  .conn-list{display:flex;flex-direction:column;gap:5px}
  .conn-item{
    display:flex;align-items:center;gap:6px;padding:6px 10px;background:#fff;border:1px solid var(--line);
    border-radius:6px;font-size:12px;cursor:pointer;transition:.15s;
  }
  .conn-item:hover{border-color:var(--accent)}
  .conn-arrow{color:var(--knk-red);font-weight:800;width:22px;flex-shrink:0;text-align:center}
  .conn-name{flex:1;font-weight:700}
  .conn-type{font-size:10px;color:var(--ink-3);padding:1px 6px;border-radius:4px;background:var(--bg)}
  .conn-type.auto{background:#dcfce7;color:#166534}
  .conn-type.nav{background:#dbeafe;color:#1e40af}

  /* 화살표 */
  .edge-nav{stroke:#94a3b8;stroke-width:1.8;fill:none;stroke-opacity:.5}
  .edge-auto{stroke:#16a34a;stroke-width:1.5;fill:none;stroke-opacity:.55;stroke-dasharray:5 3}
  .edge.active{stroke-opacity:1;stroke-width:3}
  .edge.dim{stroke-opacity:.07}

  .legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;font-size:11.5px}
  .legend-item{display:flex;align-items:center;gap:6px}
  .legend-bar{display:inline-block;width:30px;height:2.5px;border-radius:2px}

  @media print{
    .topbar,.side,.fbtn{display:none!important}
    .layout{display:block}
    .canvas-wrap{overflow:visible}
    body{background:#fff}
  }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <span class="brand">KNK 시스템 사용 흐름도</span>
    <span class="brand-sub">2026-05-21 · 일(데이터)이 화면 사이를 어떻게 흐르는가</span>
  </div>
  <div class="grow"></div>
  <button class="fbtn on" data-hub="all">전체</button>
  <button class="fbtn" data-hub="sales">매출·영업</button>
  <button class="fbtn" data-hub="logi">자재·구매</button>
  <button class="fbtn" data-hub="wf">워크플로우</button>
  <button class="fbtn" data-hub="tot">통합</button>
  <button class="fbtn" data-hub="msg">메신저</button>
  <button class="fbtn" onclick="window.print()">🖨 인쇄</button>
</div>

<div class="layout">
  <div class="canvas-wrap" id="canvas-wrap">
    <div class="legend">
      <div class="legend-item"><span class="legend-bar" style="background:#7c3aed"></span>통합</div>
      <div class="legend-item"><span class="legend-bar" style="background:#dc2626"></span>매출·영업</div>
      <div class="legend-item"><span class="legend-bar" style="background:#16a34a"></span>자재·구매</div>
      <div class="legend-item"><span class="legend-bar" style="background:#0369a1"></span>워크플로우</div>
      <div class="legend-item"><span class="legend-bar" style="background:#6b7280"></span>관리</div>
      <div class="legend-item"><span class="legend-bar" style="background:#ca8a04"></span>메신저(별도)</div>
      <div class="legend-item"><span class="legend-bar" style="background:#94a3b8"></span>사용자 이동</div>
      <div class="legend-item"><span class="legend-bar" style="background:#16a34a;border-top:1px dashed #16a34a"></span>자동 데이터 흐름</div>
    </div>

    <div class="stage-area">
      <svg id="stage-svg"></svg>
      <div class="stages" id="stages"></div>
      <div class="cross-band">
        <h3>🌐 횡단 (모든 단계에서 상시 사용) <small>— 데일리·소통·관리</small></h3>
        <div class="cross-grid" id="cross-grid"></div>
      </div>
    </div>
  </div>

  <aside class="side">
    <h2 id="side-title">📘 사용 안내</h2>
    <div class="sub" id="side-sub">화면 카드를 클릭하면 그 화면의 입출력·연결을 보여줍니다.</div>
    <div id="side-content"></div>
  </aside>
</div>

  {from:'po-receive', to:'stock-bal',  type:'auto', label:'입고 → 재고 자동 가산'},
  {from:'stock-bal',  to:'wo',         type:'nav',  label:'재고 보고 작업지시'},
  {from:'wf-project', to:'wo',         type:'auto', label:'제조 노드 → 작업지시'},
  {from:'wf-project', to:'ic-pairs',   type:'auto', label:'IC 노드 → 페어 자동 생성'},

  // ⑤ 품질·출하
  {from:'wo',         to:'qc',         type:'auto', label:'WO 완료 → QC 큐'},
  {from:'qc',         to:'qms',        type:'auto', label:'QC 누적 → QMS 분석'},
  {from:'qc',         to:'wf-logi',    type:'nav',  label:'QC 통과 → 출하 노드'},
  {from:'wf-logi',    to:'fta',        type:'nav',  label:'수출 시 FTA 첨부'},
  {from:'qms',        to:'issues',     type:'nav',  label:'재발이슈 등록'},

  // ⑥ 회계·AS
  {from:'wf-logi',    to:'wf-finance', type:'auto', label:'출하 완료 → INVOICE 노드'},
  {from:'wf-finance', to:'ic-pairs',   type:'auto', label:'IC INVOICE → 페어 매칭'},
  {from:'wf-finance', to:'issues',     type:'nav',  label:'사후 이슈 진입'},
  {from:'issues',     to:'changes',    type:'nav',  label:'재발 시 변경 공지'},
  {from:'changes',    to:'notif',      type:'auto', label:'영향 부서 자동 알림'},

  // 횡단 연결 (대표적인 것만)
  {from:'home',       to:'daily',      type:'nav',  label:'데일리 진입'},
  {from:'home',       to:'wf-my',      type:'nav',  label:'내 할 일 위젯'},
  {from:'daily',      to:'weekly',     type:'auto', label:'주간 자동 집계'},
  {from:'tickets',    to:'wf-node',    type:'nav',  label:'티켓 → 관련 노드'},
  {from:'msg',        to:'tickets',    type:'auto', label:'메시지 → 요청 승격'},
  {from:'wf-node',    to:'notif',      type:'auto', label:'핸드오프 발생 → 알림'},
  {from:'changes',    to:'tickets',    type:'auto', label:'변경 영향 → 티켓 생성'},
];

// ─── 렌더 ────────────────────────────────────────────────────
const HUB_NAMES = {tot:'통합', sales:'매출·영업', logi:'자재·구매', wf:'워크플로우', admin:'관리', msg:'메신저'};
const STAGE_TITLES = [
  ['① 영업·수주', '견적·수주·고객 등록'],
  ['② 일 순서', '프로젝트·마법사·노드 생성'],
  ['③ 설계·자재', '노드·자재 카탈로그·요청'],
  ['④ 발주·제조', '발주·입고·재고·작업지시'],
  ['⑤ 품질·출하', 'QC·QMS·통관·인도'],
  ['⑥ 회계·AS',   'INVOICE·수금·이슈·변경'],
];

let hubFilter = 'all', selectedScreen = null;
const ALL_SCREENS = [...SCREENS, ...CROSS_SCREENS];
const SCREEN_BY_ID = Object.fromEntries(ALL_SCREENS.map(s => [s.id, s]));

function renderStages() {
  const root = document.getElementById('stages');
  root.innerHTML = '';
  for (let s=1; s<=6; s++) {
    const col = document.createElement('div');
    col.className = 'stage-col';
    col.innerHTML = `<div class="stage-head">${STAGE_TITLES[s-1][0]}<small>${STAGE_TITLES[s-1][1]}</small></div>`;
    SCREENS.filter(sc => sc.stage === s).forEach(sc => col.appendChild(screenCard(sc)));
    root.appendChild(col);
  }
}
function renderCross() {
  const root = document.getElementById('cross-grid');
  root.innerHTML = '';
  CROSS_SCREENS.forEach(sc => root.appendChild(screenCard(sc)));
}
function screenCard(sc) {
  const div = document.createElement('div');
  div.className = `screen hub-${sc.hub}`;
  div.dataset.id = sc.id;
  div.innerHTML = `
    ${sc.auto ? `<span class="auto-tag auto">${sc.auto}</span>` : ''}
    <div class="name"><span class="ic">${sc.icon}</span>${sc.name}</div>
    <div class="url">${sc.url}</div>
  `;
  div.addEventListener('click', (e) => { e.stopPropagation(); selectScreen(sc.id); });
  return div;
}

function selectScreen(id) {
  selectedScreen = id;
  applyFilters();
  renderSide();
}

function applyFilters() {
  document.querySelectorAll('.screen').forEach(el => {
    const sc = SCREEN_BY_ID[el.dataset.id];
    let visible = (hubFilter === 'all' || sc.hub === hubFilter);
    el.style.display = visible ? '' : 'none';
    el.classList.remove('selected','dim');
  });
  if (!selectedScreen) {
    drawEdges(); return;
  }
  const connected = new Set([selectedScreen]);
  EDGES.forEach(e => {
    if (e.from === selectedScreen) connected.add(e.to);
    if (e.to === selectedScreen) connected.add(e.from);
  });
  document.querySelectorAll('.screen').forEach(el => {
    if (el.dataset.id === selectedScreen) el.classList.add('selected');
    else if (!connected.has(el.dataset.id)) el.classList.add('dim');
  });
  drawEdges();
}

function drawEdges() {
  // 단계 영역 크기에 SVG 맞추기
  const wrap = document.getElementById('canvas-wrap');
  const area = document.querySelector('.stage-area');
  const svg = document.getElementById('stage-svg');
  const r = area.getBoundingClientRect();
  svg.setAttribute('width', r.width);
  svg.setAttribute('height', r.height);
  svg.setAttribute('viewBox', `0 0 ${r.width} ${r.height}`);
  svg.style.width = r.width+'px';
  svg.style.height = r.height+'px';
  // 비우기
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  // 마커
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML = `
    <marker id="m-nav" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8" />
    </marker>
    <marker id="m-auto" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#16a34a" />
    </marker>
    <marker id="m-active" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#a5282c" />
    </marker>`;
  svg.appendChild(defs);

  // 화면 위치 측정
  const pos = {};
  document.querySelectorAll('.screen').forEach(el => {
    if (el.style.display === 'none') return;
    const b = el.getBoundingClientRect();
    pos[el.dataset.id] = {
      x: b.left - r.left + b.width/2,
      y: b.top - r.top + b.height/2,
      right: b.right - r.left,
      left: b.left - r.left,
      top: b.top - r.top,
      bottom: b.bottom - r.top,
    };
  });

  for (const e of EDGES) {
    const a = pos[e.from], b = pos[e.to];
    if (!a || !b) continue;
    // 두 화면이 같은 라인에 있지 않으면 곡선, 인접 컬럼이면 직선 베지어
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    const cls = e.type === 'auto' ? 'edge-auto' : 'edge-nav';
    path.setAttribute('class', `edge ${cls}`);
    // 좌→우 방향이면 right→left, 같은 컬럼 또는 아래쪽이면 직선
    let x1, y1, x2, y2;
    if (a.right < b.left - 5) { x1=a.right; y1=a.y; x2=b.left; y2=b.y; }
    else if (b.right < a.left - 5) { x1=a.left; y1=a.y; x2=b.right; y2=b.y; }
    else { x1=a.x; y1=a.bottom; x2=b.x; y2=b.top; }
    const dx = x2-x1, dy = y2-y1;
    const cx1 = x1 + dx*0.5;
    const cy1 = y1 + dy*0.0;
    const cx2 = x1 + dx*0.5;
    const cy2 = y2 - dy*0.0;
    path.setAttribute('d', `M ${x1} ${y1} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x2} ${y2}`);
    path.setAttribute('marker-end', `url(#${e.type==='auto'?'m-auto':'m-nav'})`);
    path.dataset.from = e.from; path.dataset.to = e.to; path.dataset.type = e.type;
    if (selectedScreen) {
      if (e.from === selectedScreen || e.to === selectedScreen) {
        path.classList.add('active');
        path.setAttribute('stroke', '#a5282c');
        path.setAttribute('marker-end', 'url(#m-active)');
      } else {
        path.classList.add('dim');
      }
    }
    svg.appendChild(path);
  }
}

function renderSide() {
  const t = document.getElementById('side-title');
  const s = document.getElementById('side-sub');
  const c = document.getElementById('side-content');
  if (!selectedScreen) {
    t.textContent = '📘 사용 안내';
    s.textContent = '화면 카드를 클릭하면 입력·출력·연결을 보여줍니다.';
    c.innerHTML = `
      <div class="scard">
        <h4>🎯 협의 가이드</h4>
        <p>
          1) <b>① 영업·수주</b>부터 ⑥까지 흐름을 따라가며 단계 누락 확인<br>
          2) <b>실선 화살표</b>: 사용자가 직접 클릭해 이동<br>
          3) <b>녹색 점선</b>: 시스템이 자동으로 다음으로 흘려보냄 (입력 없이도 채워짐)<br>
          4) 카드의 <span style="background:#dcfce7;color:#166534;padding:1px 5px;border-radius:3px;font-size:10px;font-weight:700;">자동</span> 태그 = 사람이 안 만들고 시스템이 자동 생성<br>
          5) <b>상단 Hub 필터</b>로 그 부서가 쓰는 화면만 추리기
        </p>
      </div>
      <div class="scard">
        <h4>🔥 흐름 핵심 5</h4>
        <p>
          • 수주 등록 → <b>프로젝트 자동 생성</b><br>
          • 마법사 → <b>27~47 노드 자동 생성</b><br>
          • 노드 완료 → <b>다음 담당자 자동 알림 + 일일업무 자동 등록</b><br>
          • 입고 → <b>재고 자동 가산</b><br>
          • 메신저 메시지 → <b>요청 티켓 승격</b> (✱ 메시지 옆 📌 클릭)
        </p>
      </div>
    `;
    return;
  }
  const sc = SCREEN_BY_ID[selectedScreen];
  t.innerHTML = `<span>${sc.icon}</span> ${sc.name}`;
  s.innerHTML = `<span style="display:inline-block;background:var(--bg);padding:2px 7px;border-radius:4px;color:var(--ink-2);font-weight:700;">${HUB_NAMES[sc.hub] || sc.hub}</span> <span style="margin-left:6px;">${sc.desc || ''}</span>`;

  const incoming = EDGES.filter(e => e.to === selectedScreen);
  const outgoing = EDGES.filter(e => e.from === selectedScreen);

  let html = `
    <div class="scard">
      <h4>🔗 시스템 URL</h4>
      <a class="url-pill" href="${BASE_URL}${sc.url.replace('{id}','1')}" target="_blank">${BASE_URL}${sc.url}</a>
      ${sc.auto ? `<div style="margin-top:8px;font-size:11.5px;"><b style="color:#16a34a;">⚡ ${sc.auto}</b></div>` : ''}
    </div>
  `;

  if (incoming.length) {
    html += `<div class="scard"><h4>⬇ 들어오는 흐름 (${incoming.length})</h4><div class="conn-list">`;
    for (const e of incoming) {
      const from = SCREEN_BY_ID[e.from] || {name:e.from,icon:'❓'};
      html += `<div class="conn-item" onclick="selectScreen('${e.from}')">
        <span class="conn-arrow">←</span>
        <span class="conn-name">${from.icon} ${from.name}</span>
        <span class="conn-type ${e.type}">${e.type==='auto'?'자동':'사용자'}</span>
      </div>
      <div style="font-size:11px;color:var(--ink-3);padding:0 10px 6px 38px;">${e.label||''}</div>`;
    }
    html += `</div></div>`;
  }

  if (outgoing.length) {
    html += `<div class="scard"><h4>⬆ 나가는 흐름 (${outgoing.length})</h4><div class="conn-list">`;
    for (const e of outgoing) {
      const to = SCREEN_BY_ID[e.to] || {name:e.to,icon:'❓'};
      html += `<div class="conn-item" onclick="selectScreen('${e.to}')">
        <span class="conn-arrow">→</span>
        <span class="conn-name">${to.icon} ${to.name}</span>
        <span class="conn-type ${e.type}">${e.type==='auto'?'자동':'사용자'}</span>
      </div>
      <div style="font-size:11px;color:var(--ink-3);padding:0 10px 6px 38px;">${e.label||''}</div>`;
    }
    html += `</div></div>`;
  }

  if (!incoming.length && !outgoing.length) {
    html += `<div class="scard"><h4>🔗 연결</h4><p>이 화면에 정의된 연결이 없습니다. (단독 진입/조회용)</p></div>`;
  }
  document.getElementById('side-content').innerHTML = html;
}

// 필터
document.querySelectorAll('.fbtn[data-hub]').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.fbtn[data-hub]').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    hubFilter = b.dataset.hub;
    selectedScreen = null;
    applyFilters();
    renderSide();
  });
});

// 빈 공간 클릭 → 선택 해제
document.getElementById('canvas-wrap').addEventListener('click', (e) => {
  if (!e.target.closest('.screen')) {
    selectedScreen = null;
    applyFilters();
    renderSide();
  }
});

// 리사이즈 시 엣지 재계산
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(drawEdges, 100);
});

// 초기 렌더
renderStages();
renderCross();
setTimeout(() => { drawEdges(); renderSide(); }, 50);
</script>
</body>
</html>
