<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>KNK 메신저 로그인</title>
  <link rel="manifest" href="{{ base_path }}/manifest.json">
  <meta name="theme-color" content="#A5282C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KNK 메신저">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/icon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ asset_version }}">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="brand-mark">KNK</div>
    <h1 class="brand">KNK 메신저</h1>
    <p class="brand-sub">사내 업무 전용</p>
    <form method="post" class="login-form" id="loginForm">
      <label>아이디
        <input id="loginUsername" name="username" autocomplete="username" required>
      </label>
      <label>비밀번호
        <div class="pw-wrap">
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" data-pw-toggle-for="loginPassword" title="비밀번호 보기/숨기기" aria-label="비밀번호 보기">👁</button>
        </div>
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="rememberId" checked>
        <span>아이디 기억하기</span>
      </label>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      {% if notice %}<div class="error" style="background:#FEF3C7;color:#92400E;border-color:#FCD34D;">{{ notice }}</div>{% endif %}
      <button type="submit">로그인</button>
      <p class="hint" style="margin-top:8px;font-size:11px;color:#9ca3af;">한번 로그인하면 로그아웃 누르기 전까지 자동 로그인 유지됩니다 (90일).</p>
    </form>
    <p class="hint" style="font-size:11px;color:#9ca3af;">신규 직원 등록은 관리자에게 문의 — 초기 비밀번호는 본인 휴대폰 번호</p>

  </main>

  <script>
    // ID 자동 기억 — localStorage 에 마지막 username 보관
    (function() {
      const u = document.getElementById("loginUsername");
      const p = document.getElementById("loginPassword");
      const c = document.getElementById("rememberId");
      const f = document.getElementById("loginForm");
      try {
        const saved = localStorage.getItem("knkmsg.lastUser");
        if (saved) {
          u.value = saved;
          // ID 가 미리 채워졌으면 비번 입력칸에 즉시 포커스
          setTimeout(() => p.focus(), 50);
        } else {
          u.focus();
        }
      } catch(e) { u.focus(); }

      f.addEventListener("submit", () => {
        try {
          if (c.checked && u.value.trim()) {
            localStorage.setItem("knkmsg.lastUser", u.value.trim());
          } else {
            localStorage.removeItem("knkmsg.lastUser");
          }
        } catch(e) {}
      });
    })();

    // ===== 비밀번호 보기/숨기기 토글 (👁) =====
    document.querySelectorAll(".pw-toggle").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-pw-toggle-for");
        var inp = document.getElementById(id);
        if (!inp) return;
        var shown = inp.type === "text";
        inp.type = shown ? "password" : "text";
        btn.textContent = shown ? "👁" : "🙈";
        btn.classList.toggle("shown", !shown);
        btn.setAttribute("aria-label", shown ? "비밀번호 보기" : "비밀번호 숨기기");
      });
    });

    // ===== PWA 설치 안내 — 삭제됨 (대표 지시 2026-05-19) =====
    // 옛 dismissed 마커가 있으면 정리 (모든 사용자 1회성 클린업)
    try { localStorage.removeItem("knkmsg.pwaDismissed"); } catch(e) {}
  </script>
</body>
</html>
