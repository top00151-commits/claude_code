<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>KNK 메신저 로그인</title>
  <link rel="manifest" href="{{ base_path }}/manifest.json">
  <meta name="theme-color" content="#A5282C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KNK 메신저">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/icon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ asset_version }}">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="brand-mark">KNK</div>
    <h1 class="brand">KNK 메신저</h1>
    <p class="brand-sub">사내 업무 전용</p>
    <form method="post" class="login-form" id="loginForm">
      <label>아이디
        <input id="loginUsername" name="username" autocomplete="username" required>
      </label>
      <label>비밀번호
        <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="rememberId" checked>
        <span>아이디 기억하기</span>
      </label>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <button type="submit">로그인</button>
      <p class="hint" style="margin-top:8px;font-size:11px;color:#9ca3af;">한번 로그인하면 로그아웃 누르기 전까지 자동 로그인 유지됩니다 (90일).</p>
    </form>
    <p class="hint">테스트 계정: <code>kjr</code> / <code>hong</code> / <code>lee</code> · 비밀번호 <code>knk1234</code></p>

    <!-- PWA 설치 안내 (브라우저 별로 다른 안내) -->
    <div class="pwa-install" id="pwaInstall" hidden>
      <div class="pwa-install-icon">📱</div>
      <div class="pwa-install-body">
        <div class="pwa-install-title">앱처럼 별도 창으로 사용하기</div>
        <div class="pwa-install-desc" id="pwaInstallDesc"></div>
      </div>
      <button type="button" id="pwaInstallBtn" hidden>설치</button>
      <button type="button" class="pwa-close" id="pwaCloseBtn" aria-label="닫기">✕</button>
    </div>
  </main>

  <script>
    // ID 자동 기억 — localStorage 에 마지막 username 보관
    (function() {
      const u = document.getElementById("loginUsername");
      const p = document.getElementById("loginPassword");
      const c = document.getElementById("rememberId");
      const f = document.getElementById("loginForm");
      try {
        const saved = localStorage.getItem("knkmsg.lastUser");
        if (saved) {
          u.value = saved;
          // ID 가 미리 채워졌으면 비번 입력칸에 즉시 포커스
          setTimeout(() => p.focus(), 50);
        } else {
          u.focus();
        }
      } catch(e) { u.focus(); }

      f.addEventListener("submit", () => {
        try {
          if (c.checked && u.value.trim()) {
            localStorage.setItem("knkmsg.lastUser", u.value.trim());
          } else {
            localStorage.removeItem("knkmsg.lastUser");
          }
        } catch(e) {}
      });
    })();

    // ===== PWA 설치 안내 (별도 창처럼 사용) =====
    (function() {
      const banner = document.getElementById("pwaInstall");
      const desc = document.getElementById("pwaInstallDesc");
      const btn = document.getElementById("pwaInstallBtn");
      const closeBtn = document.getElementById("pwaCloseBtn");

      // 이미 PWA 모드(standalone) 면 안내 안 함
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
      if (isStandalone) return;

      // 사용자가 X 눌렀으면 24시간 안 보임
      try {
        const dismissed = localStorage.getItem("knkmsg.pwaDismissed");
        if (dismissed && (Date.now() - parseInt(dismissed)) < 86400000) return;
      } catch(e) {}

      const ua = navigator.userAgent;
      const isiOS = /iPhone|iPad|iPod/.test(ua) && !window.MSStream;
      const isAndroid = /Android/.test(ua);

      if (isiOS) {
        // iOS Safari — beforeinstallprompt 지원 안 함. 수동 안내.
        desc.innerHTML = '아래 <b>공유 버튼</b> ↑ 누르고 → "홈 화면에 추가" 선택';
        banner.hidden = false;
      } else if (isAndroid) {
        // Android Chrome — beforeinstallprompt 자동 트리거 가능. 안 되면 수동 안내.
        desc.innerHTML = '브라우저 메뉴(⋮) → "홈 화면에 추가" / "앱 설치"';
        banner.hidden = false;
      } else {
        // 데스크탑 Chrome / Edge — beforeinstallprompt 시 설치 버튼 표시
        desc.innerHTML = '주소창 우측 ⊕ 아이콘 또는 메뉴 → "앱 설치"';
        banner.hidden = false;
      }

      // 브라우저가 beforeinstallprompt 이벤트 주면 자동 설치 버튼 활성
      let deferredPrompt = null;
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        btn.hidden = false;
        desc.innerHTML = '한 번 누르면 바탕화면/홈화면에 앱처럼 추가됩니다';
      });
      btn.addEventListener("click", async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const choice = await deferredPrompt.userChoice;
        if (choice.outcome === "accepted") banner.hidden = true;
        deferredPrompt = null;
      });

      closeBtn.addEventListener("click", () => {
        banner.hidden = true;
        try { localStorage.setItem("knkmsg.pwaDismissed", Date.now().toString()); } catch(e) {}
      });
    })();
  </script>
</body>
</html>
