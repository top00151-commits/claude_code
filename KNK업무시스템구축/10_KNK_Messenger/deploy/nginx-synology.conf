# ============================================================
# KNK Messenger - Nginx (Synology Docker Ubuntu 컨테이너용)
# ============================================================
# 외부: http://o.knknara.co.kr:3310/  -> 컨테이너 :80 -> 이 nginx -> gunicorn :5050
# 위치: /etc/nginx/sites-available/knk-messenger
#       (또는 /etc/nginx/conf.d/knk-messenger.conf 로 배치)
# ============================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 대용량 파일(DWG·동영상) 1.2G (대표 지시 2026-05-19 — 단일 500MB · 합계 1GB + 마진)
    client_max_body_size 1200M;
    client_body_timeout 600s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # 정적 파일은 nginx가 직접
    location /static/ {
        alias /opt/knk_messenger/static/;
        expires 1d;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    # WebSocket (Socket.IO)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # 메인 앱
    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 75명 동시 사용 시 일부 요청 큐잉 가능 → 60→120s 로 여유 (2026-05-20)
        proxy_read_timeout 120;
        proxy_send_timeout 120;
    }

    # 보안 헤더 (HTTP 환경이라 HSTS 는 X — HTTPS 붙은 후 추가)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:5050/login;
        proxy_set_header Host $host;
    }
}
