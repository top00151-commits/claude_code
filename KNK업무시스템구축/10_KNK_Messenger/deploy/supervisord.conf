; ============================================================
; KNK Messenger - supervisord 설정 (Synology Docker Ubuntu 20.04)
; ============================================================
; systemctl 이 없는 컨테이너 환경에서 gunicorn + nginx 를 띄우는 process supervisor.
;
; 위치: /etc/supervisor/conf.d/knk-messenger.conf
; 적용: supervisorctl reread && supervisorctl update
; 상태: supervisorctl status
; 재시작: supervisorctl restart knk-messenger
; 로그: tail -f /opt/knk_messenger/logs/gunicorn.log
; ============================================================

[program:knk-messenger]
command=/opt/knk_messenger/.venv/bin/gunicorn -k eventlet -w 1 --bind 127.0.0.1:5050 --timeout 600 --graceful-timeout 60 --access-logfile - --error-logfile - wsgi:app
directory=/opt/knk_messenger
user=root
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stdout_logfile=/opt/knk_messenger/logs/gunicorn.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/opt/knk_messenger/logs/gunicorn.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=
    PYTHONUNBUFFERED="1",
    PYTHONIOENCODING="utf-8",
    PYTHONUTF8="1"

[program:knk-nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
stdout_logfile=/var/log/nginx/supervisor.log
stderr_logfile=/var/log/nginx/supervisor.err.log
