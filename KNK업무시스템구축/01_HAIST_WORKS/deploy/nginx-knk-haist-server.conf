# ============================================================
# HAIST WORKS — nginx server block (메신저 컨테이너 내부)
# v5H226z76 (2026-05-11)
# ============================================================
# 적용 위치 (옵션):
#   /etc/nginx/sites-available/knk-haist  (별도 server block 분리)
#   /etc/nginx/sites-enabled/knk-haist    (심볼릭 링크)
#
# 또는 기존 메신저 nginx conf 의 별도 server { } 블록으로 추가.
#
# 외부 라우터 라우팅 옵션:
#   (α) 외부 3320 → 컨테이너 8090         (이 conf 의 listen)
#   (β) haist.knknara.co.kr → 컨테이너 80 → server_name 분기
# ============================================================

server {
    listen 8090 default_server;
    listen [::]:8090 default_server;

    server_name _;  # 옵션 (β) 사용 시: haist.knknara.co.kr 로 교체

    # 업로드 사이즈
    client_max_body_size 50M;
    client_body_timeout  120s;
    send_timeout         120s;

    # 보안 헤더 (HTTPS 추가 시 HSTS 도 추가)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 정적 자산 (nginx 직접 서빙 — 빠름)
    location /static/ {
        alias /opt/knk_haist/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 메인 앱 — uvicorn 8081
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8081/login;
        access_log off;
    }
}
