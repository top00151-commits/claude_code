# ============================================================
# HAIST WORKS - Synology NAS nginx 리버스 프록시 설정
# v5H226z75 (2026-05-11)
# ============================================================
# 적용 위치 (DSM 권장):
#   Control Panel → Login Portal → Advanced → Reverse Proxy
#   - Source:      HTTPS / haist.knk.co.kr / 443
#   - Destination: HTTP  / localhost / 8081
#
# 또는 별도 nginx 컨테이너 사용 시 본 파일을 mount:
#   /etc/nginx/conf.d/knk-haist.conf
# ============================================================

# HTTP → HTTPS 강제 (Let's Encrypt SSL 인증서 적용 후)
server {
    listen 80;
    listen [::]:80;
    server_name haist.knk.co.kr;
    return 301 https://$server_name$request_uri;
}

# HTTPS 메인 server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name haist.knk.co.kr;

    # SSL (Let's Encrypt / Synology DSM 가 자동 갱신)
    ssl_certificate     /etc/letsencrypt/live/haist.knk.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haist.knk.co.kr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 보안 헤더
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 업로드 사이즈 (소모품 엑셀·이미지 첨부 대응)
    client_max_body_size 50M;
    client_body_timeout  120s;
    send_timeout         120s;

    # 정적 자산 (NAS 호스트가 직접 서빙 — 빠름)
    location /static/ {
        alias /volume1/docker/knk-haist/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 업로드 파일 (인증 우회 위해 앱으로 프록시 권장 — 필요 시 alias)
    # location /uploads/ {
    #     alias /volume1/docker/knk-haist/uploads/;
    # }

    # 메인 앱 — HAIST WORKS (uvicorn 8081)
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;
    }

    # 헬스체크 (외부 monitoring 용)
    location = /healthz {
        proxy_pass http://127.0.0.1:8081/login;
        access_log off;
    }
}
