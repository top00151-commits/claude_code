# ============================================================
# HAIST WORKS — nginx location 블록 (메신저 컨테이너 내부)
# v5H226z108n20 (2026-05-28)
# ============================================================
# 적용 대상:  메신저 컨테이너 안 /etc/nginx/conf.d/knk-messenger.conf
#             (또는 그에 해당하는 메신저 nginx 설정 파일) 의
#             `server { server_name haist.knknara.co.kr; ... }` 블록 안.
#
# 추가 위치:  `location /msg/` 블록 옆 (또는 위) — 같은 server 블록 안.
#
# 핵심 동작:
#   1) /works/ → 백엔드 (uvicorn 8081) 로 prefix 제거 후 전달 (proxy_pass 끝에 /)
#   2) 응답 HTML·JS 안의 절대경로(/login, /static/... 등)를 /works/login 식으로 자동 재작성
#      → HAIST WORKS 코드 0 변경. nginx 가 변환 처리.
#   3) 30x 리다이렉트 헤더도 /works/ prefix 추가 (proxy_redirect)
# ============================================================

# === HAIST WORKS (haist.knknara.co.kr/works/) === BEGIN
location /works/ {
    # 큰 업로드 (자재 사진·견적 PDF) 대비
    client_max_body_size 100M;
    client_body_timeout  300s;

    proxy_pass http://127.0.0.1:8081/;       # 끝에 / 있어야 /works/ prefix 제거됨
    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  https;
    proxy_set_header X-Forwarded-Prefix /works;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering    off;

    # sub_filter 가 평문에서만 동작 — gzip 해제 강제
    proxy_set_header Accept-Encoding "";

    # 응답 HTML·JS 안의 절대경로를 /works/ prefix 자동 추가
    # (HAIST WORKS 875+ 곳의 hardcoded /path 를 코드 수정 없이 처리)
    sub_filter_once off;
    # text/html 은 nginx 기본 — 명시하면 duplicate MIME type 경고
    sub_filter_types text/css text/javascript application/javascript application/json;
    sub_filter 'href="/'         'href="/works/';
    sub_filter "href='/"         "href='/works/";
    sub_filter 'src="/'          'src="/works/';
    sub_filter "src='/"          "src='/works/";
    sub_filter 'action="/'       'action="/works/';
    sub_filter "action='/"       "action='/works/";
    sub_filter 'fetch("/'        'fetch("/works/';
    sub_filter "fetch('/"        "fetch('/works/";
    sub_filter 'url("/'          'url("/works/';
    sub_filter "url('/"          "url('/works/";

    # 다음 패턴은 prefix 두 번 되는 것 방지 (이미 /works/ 시작이면 그대로)
    # nginx sub_filter 는 한 번에 한 매치라 위 규칙이 이미 /works/works/ 만들지는 않음.

    # 30x 응답의 Location 헤더에도 /works/ prefix
    proxy_redirect / /works/;
    proxy_redirect ~^/(.*)$ /works/$1;
}
# === HAIST WORKS === END
