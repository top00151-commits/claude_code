; ============================================================
; HAIST WORKS — supervisord program (메신저 컨테이너 내부)
; v5H226z108n20 (2026-05-28)
; ============================================================
; 적용 위치 (컨테이너 내부):
;   /etc/supervisor/conf.d/knk-works.conf
;
; 적용 명령 (컨테이너 내부):
;   supervisorctl reread
;   supervisorctl update
;   supervisorctl status knk-works
;
; 메신저(knk-messenger) 와 같은 supervisord 인스턴스에서 공존.
; ============================================================

[program:knk-works]
command=/opt/knk_haist/.venv/bin/uvicorn app.main:app
    --host 127.0.0.1
    --port 8081
    --workers 2
    --proxy-headers
    --forwarded-allow-ips=127.0.0.1
directory=/opt/knk_haist
user=root
autostart=true
autorestart=true
startsecs=10
startretries=5
stopwaitsecs=10
stopasgroup=true
killasgroup=true

environment=
    PATH="/opt/knk_haist/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
    PYTHONUNBUFFERED="1",
    PYTHONIOENCODING="utf-8",
    PYTHONUTF8="1",
    TZ="Asia/Seoul",
    LANG="C.UTF-8",
    LC_ALL="C.UTF-8"

; .env (KNK_SECRET_KEY 등) 는 main.py 가 직접 로드하지 않으므로
; install 스크립트가 systemd-style EnvironmentFile 대용으로
; .venv 활성화 + .env export 한 wrapper script 를 만들거나,
; 또는 아래처럼 supervisor environment 에 명시.
; → install 스크립트가 .env 를 읽어 supervisor conf 의 environment= 줄을 동적 보강.

stdout_logfile=/opt/knk_haist/logs/uvicorn.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/opt/knk_haist/logs/uvicorn-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
