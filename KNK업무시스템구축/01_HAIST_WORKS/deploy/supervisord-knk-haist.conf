; ============================================================
; HAIST WORKS — supervisord program block
; v5H226z76 (2026-05-11) — 단일 Ubuntu 20.04 컨테이너 환경
; ============================================================
; 적용 위치:
;   /etc/supervisor/conf.d/knk-haist.conf
;
; 적용 명령:
;   supervisorctl reread
;   supervisorctl update
;   supervisorctl start knk-haist
;
; 메신저(knk-messenger) 와 같은 supervisord 인스턴스에서 공존.
; ============================================================

[program:knk-haist]
command=/opt/knk_haist/.venv/bin/python /opt/knk_haist/run.py
directory=/opt/knk_haist
user=root
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=10
stopasgroup=true
killasgroup=true
environment=
    PATH="/opt/knk_haist/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
    PYTHONUNBUFFERED="1",
    PYTHONIOENCODING="utf-8",
    PYTHONUTF8="1",
    TZ="Asia/Seoul",
    LANG="C.UTF-8",
    LC_ALL="C.UTF-8",
    KNK_MODE="prod",
    KNK_HOST="0.0.0.0",
    KNK_PORT="8081",
    KNK_WORKERS="2"
stdout_logfile=/opt/knk_haist/logs/uvicorn.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/opt/knk_haist/logs/uvicorn-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
; KNK_SECRET_KEY 는 /opt/knk_haist/.env 에서 별도 로드 (setup.sh 가 export 처리)
