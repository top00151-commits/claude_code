{# 메일 '앱(독립 창)' 모드 헤더 — KNK Eum 등에서 ?app=1 로 별도 창 실행 시 사용.
   WORKS 사이드바 대신 슬림 메일 상단바 + 본문 전체폭. ?app=0 으로 WORKS 전체화면 복귀. #}
<style>
  body .app { display:block !important; min-width:auto !important; height:auto !important; overflow:visible !important; }
  body .main { width:100% !important; grid-column:auto !important; padding-right:0 !important; }
  .mail-app-top { position:sticky; top:0; z-index:60; display:flex; align-items:center; gap:6px; flex-wrap:wrap;
                  background:var(--knk-red,#b91c1c); color:#fff; padding:9px 16px; box-shadow:0 2px 8px rgba(0,0,0,.12); }
  .mail-app-top .brand { font-weight:800; font-size:15px; margin-right:8px; }
  .mail-app-top a { color:#fff; text-decoration:none; font-size:13px; opacity:.92; padding:5px 10px; border-radius:7px; }
  .mail-app-top a:hover { background:rgba(255,255,255,.16); opacity:1; }
  .mail-app-top .sp { flex:1; }
  .mail-app-top .exit { font-size:12px; opacity:.85; border:1px solid rgba(255,255,255,.4); }
</style>
<div class="mail-app-top">
  <span class="brand">📧 HAIST WORKS 메일함</span>
  <a href="/mail/inbox">받은편지함</a>
  <a href="/mail/sent">보낸편지함</a>
  <a href="/mail/drafts">임시보관함</a>
  <a href="/mail/compose">✏️ 쓰기</a>
  <span class="sp"></span>
  <a href="/mail/inbox?app=0" class="exit" title="WORKS 전체화면(사이드바)으로 보기">⤢ WORKS 전체화면</a>
</div>
