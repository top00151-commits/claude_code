{# 메일 화면 테마(11-19 대표 「테마 3가지 · 골라서 쓰게 · 지금은 누런 바탕이라 눈이 아프고 글씨가 잘 안 보임」)
   ☀️ 밝게(기본) · 🌤 부드럽게 · 🌙 어둡게 — 이 컴퓨터에 기억(knkmail.theme) · 메일 화면에만(WORKS 다른 화면은 그대로)
   화면 글 속 고정 색은 var(--mt-*, 원래 색) 으로 바꿔 두었고, 여기서 그 값을 테마마다 정한다.
   메일 본문(보낸 사람이 만든 모양)과 쓰는 칸은 어느 테마에서나 흰 종이 그대로 — 받는 사람이 보는 모양과 같게. #}
<script>
(function(){ var t='clear'; try{ t=localStorage.getItem('knkmail.theme')||'clear'; }catch(e){}
  if(['clear','soft','dark'].indexOf(t)<0) t='clear'; document.documentElement.setAttribute('data-mt', t); })();
window.mailThemeMark=function(){ var t=document.documentElement.getAttribute('data-mt')||'clear';
  document.querySelectorAll('.mt-card[data-mt-k]').forEach(function(b){ var on=b.getAttribute('data-mt-k')===t; b.classList.toggle('on', on); b.setAttribute('aria-checked', on?'true':'false'); }); };
window.mailThemeSet=function(k){ if(['clear','soft','dark'].indexOf(k)<0) k='clear';
  try{ localStorage.setItem('knkmail.theme', k); }catch(e){}
  document.documentElement.setAttribute('data-mt', k); mailThemeMark(); };
window.mailThemeToggle=function(ev){ if(ev) ev.stopPropagation(); var p=document.getElementById('mailThemePop'); if(!p) return; p.hidden=!p.hidden; if(!p.hidden) mailThemeMark(); };
document.addEventListener('click', function(e){ var p=document.getElementById('mailThemePop'); if(p && !p.hidden && !e.target.closest('#mailThemePop')) p.hidden=true; });
document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ var p=document.getElementById('mailThemePop'); if(p && !p.hidden){ p.hidden=true; } } });
document.addEventListener('DOMContentLoaded', function(){ try{ mailThemeMark(); }catch(e){} });
// 다른 창(새 창으로 연 메일 등)에서 바꾸면 이 창도 바로 따라감
window.addEventListener('storage', function(e){ if(e.key==='knkmail.theme'){ var k=e.newValue||'clear'; if(['clear','soft','dark'].indexOf(k)<0) k='clear'; document.documentElement.setAttribute('data-mt', k); try{ mailThemeMark(); }catch(_){} } });
</script>
<style>

    --mt-text:#111827; --mt-text2:#374151; --mt-mute:#56606e; --mt-sel:#e2ecfd; --mt-unread:#1d4ed8; --mt-link:#1d4ed8;
    --paper:#eceff3; --paper-2:#f3f4f6; --paper-3:#ffffff; --paper-warm:#f6f7f9; --warm-tan:#e5e7eb;
    --ink:#111827; --ink-soft:#374151; --mute:#56606e; --mute-2:#9aa3af; --line:#cfd6de; --line-strong:#a9b3bf; --line-soft:#eef0f3; }
  html[data-mt="soft"]{ color-scheme:light;

    --mt-text:#16202c; --mt-text2:#2d3949; --mt-mute:#4a5768; --mt-sel:#c6d9ef; --mt-unread:#1a4cb0; --mt-link:#1a4cb0;
    --paper:#d3dce5; --paper-2:#e1e8ee; --paper-3:#edf1f5; --paper-warm:#e1e8ee; --warm-tan:#c9d3de;
    --ink:#16202c; --ink-soft:#2d3949; --mute:#4a5768; --mute-2:#8491a1; --line:#b2bfcc; --line-strong:#8f9fb1; --line-soft:#dbe2e9; }
  html[data-mt="dark"]{ color-scheme:dark;
    --mt-bg:#111317; --mt-surface:#1c1f24; --mt-panel:#171a1e; --mt-hover:#282d34; --mt-line:#363c45; --mt-sep:#525b67; --mt-gutter:#24282e; --mt-thumb:#5c6571; --mt-track:#1a1d21;
    --mt-text:#e8ebef; --mt-text2:#c6ccd4; --mt-mute:#9ba4b0; --mt-sel:#203454; --mt-unread:#8ab4f8; --mt-link:#8ab4f8;

    --ink:#e8ebef; --ink-soft:#c6ccd4; --mute:#9ba4b0; --mute-2:#6b7480; --line:#363c45; --line-strong:#4a525d; --line-soft:#22262c;
    --amber-glow:#3a3120; }
  /* 공통 — 바탕·글자 */

  html[data-mt] .main{ background:var(--mt-bg) !important; color:var(--mt-text); }

  html[data-mt] .mbx-row.unread .mbx-time, html[data-mt] .mbx-headlink.unread .mbx-time{ color:var(--mt-unread) !important; }

  html[data-mt] input::placeholder, html[data-mt] textarea::placeholder{ color:var(--mt-mute); opacity:1; }
  /* 11-19 대표 「페이지 구성별 구분선들이 잘 안 보여」 — 칸 경계는 진한 선(sep) · 칸 사이 손잡이 줄은 바탕과 다른 색 + 양쪽 선 */
  html[data-mt] .mbx-split{ border-color:var(--mt-sep) !important; }
  /* 스크롤 막대: 빨간 막대가 칸마다 서서 구분선처럼 보이던 것 → 차분한 회색(늘 보이는 굵기는 그대로) */
  html[data-mt] .main{ scrollbar-color:var(--mt-thumb) var(--mt-track); }
  html[data-mt] .main::-webkit-scrollbar-track{ background:var(--mt-track); }
  html[data-mt] .main::-webkit-scrollbar-thumb, html[data-mt] .main::-webkit-scrollbar-thumb:hover{ background:var(--mt-thumb); border-color:var(--mt-track); background-clip:content-box; }
  html[data-mt] .mbx-gutter{ background:var(--mt-gutter) !important; box-shadow:inset 1px 0 0 var(--mt-sep), inset -1px 0 0 var(--mt-sep); }
  html[data-mt] .mbx-split.v-bottom>.mbx-gutter[data-g="2"]{ box-shadow:inset 0 1px 0 var(--mt-sep), inset 0 -1px 0 var(--mt-sep); }

  html[data-mt] .mbx-gutter:hover, html[data-mt] .mbx-gutter.dragging{ background:var(--knk-red,#a5282c) !important; }

  html[data-mt] .mbx-day{ border-top:1px solid var(--mt-line); border-bottom-color:var(--mt-sep) !important; }
  html[data-mt] .mbx-row, html[data-mt] .mbx-thread{ border-bottom-color:var(--mt-line); }
  html[data-mt] .mail-tools{ border-bottom-color:var(--mt-sep) !important; }
  html[data-mt] .mv-head, html[data-mt] .mv-frame, html[data-mt] .mv-atts{ border-color:var(--mt-sep) !important; }
  html[data-mt] .mbx-fold-div{ background:var(--mt-sep) !important; }
  html[data-mt] .mbx-search input[type=text]{ border-color:var(--mt-sep); }
  /* 메일 본문·쓰는 칸 = 어느 테마에서나 흰 종이(받는 사람이 보는 모양 그대로) */
  html[data-mt] .mv-frame{ background:#fff !important; border-radius:8px; }
  html[data-mt] .cmp-editor{ background:#fff !important; color:#111 !important; }
  html[data-mt] .cmp-editor:empty:before{ color:#6b7280 !important; }
  /* 어둡게 — 고정 밝은 색이 남은 곳 */
