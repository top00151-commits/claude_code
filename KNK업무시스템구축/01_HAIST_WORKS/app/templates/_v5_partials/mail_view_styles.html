<style>
  /* 메일 내용 보기 — 풀페이지(mail_view)와 읽기 창(mail_inbox 우측 pane) 공용 */
  .mv-head{border:1px solid var(--line);border-radius:12px;background:var(--mt-surface,var(--knk-mail-c-white));padding:16px 18px;margin-bottom:14px}
  .mv-subj{font-size:18px;font-weight:700;margin:0 0 8px;line-height:1.4}
  .mv-meta{font-size:12.5px;color:var(--mute);line-height:1.85}
  .mv-ct-inline{display:inline-block;margin-left:6px;padding:0 8px;border:1px solid var(--knk-mail-c-violet-15);border-radius:999px;font-size:11.5px;font-weight:700;color:var(--knk-mail-c-violet-50);background:var(--knk-mail-c-violet-02);text-decoration:none;line-height:1.7;vertical-align:1px}
  .mv-reply{margin:0 0 10px;font-size:12.5px;color:var(--mt-mute,var(--knk-mail-c-gray-54));display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .mv-reply.on{padding:9px 12px;border-radius:10px;border:1px solid var(--knk-mail-c-amber-35);background:var(--knk-mail-c-yellow-04);color:var(--knk-mail-c-orange-69)}
  .mv-reply.on.lv2{border-color:var(--knk-mail-c-red-18);background:var(--knk-mail-c-red-03);color:var(--knk-mail-c-red-65)}
  .mv-reply-why{font-weight:500}
  .mv-reply-btn{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--mt-line,var(--knk-mail-c-gray-16-3));background:var(--mt-surface,var(--knk-mail-c-white));color:var(--mt-text2,var(--knk-mail-c-blue-73-2));cursor:pointer;text-decoration:none}
  .mv-reply-btn.mv-reply-go{border-color:var(--knk-mail-c-red-49);background:var(--knk-mail-c-red-49);color:var(--knk-mail-c-white)}
  .mv-reply-btn:hover{filter:brightness(.96)}
  @media print{.mv-reply{display:none}}
  /* 11-21 다 묶음 — 👔 윗분 · 나 = 받는 사람/참조 */
  .mv-boss{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:6px;background:var(--knk-mail-c-yellow-11);color:var(--knk-mail-c-orange-69);border:1px solid var(--knk-mail-c-amber-35);vertical-align:1px}
  .mv-me{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:6px;margin-right:4px}
  .mv-me.to{background:var(--knk-mail-c-green-07);color:var(--knk-mail-c-green-76);border:1px solid var(--knk-mail-c-green-27)}
  .mv-me.cc{background:var(--knk-mail-c-violet-05);color:var(--knk-mail-c-violet-58);border:1px solid var(--knk-mail-c-violet-15)}
  .mv-me.bcc{background:var(--knk-mail-c-gray-04);color:var(--knk-mail-c-gray-65);border:1px solid var(--knk-mail-c-gray-16)}
  /* 11-22 대표 「받는 사람이 도대체 누구인지 — 배치가 너무 정신없어」 — 받는 사람·참조 = 사람마다 칩(넷 넘으면 「외 N명 ▾」) */
  .mv-rc{display:inline-flex;flex-wrap:wrap;align-items:center;gap:3px;margin-right:8px;vertical-align:middle}
  .mv-rc-l{font-size:11.5px;font-weight:700;color:var(--mute);margin-right:2px;white-space:nowrap}
  .mv-rc-p{display:inline-block;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px;border-radius:999px;border:1px solid var(--line);background:var(--mt-surface,var(--knk-mail-c-white));color:var(--ink);font-size:12px;line-height:1.75}
  .mv-rc-p.me{background:var(--knk-mail-c-green-07);border-color:var(--knk-mail-c-green-27);color:var(--knk-mail-c-green-76);font-weight:700}
  .mv-rc-p.x{display:none}
  .mv-rc.all .mv-rc-p.x{display:inline-block}
  .mv-rc-p.grp{padding:0;border:0;background:none;overflow:visible;max-width:none}
  .mv-rc-p.grp .mv-grp-i{position:relative;display:inline-block;padding:0;border:0;background:none}
  .mv-via{display:inline-block;font-size:10.5px;font-weight:800;line-height:1.4;padding:0 5px;margin-right:4px;border-radius:999px;background:var(--knk-mail-c-green-64);color:var(--knk-mail-c-white);vertical-align:1px}
  .mv-rc-p.via{border-color:var(--knk-mail-c-green-27);background:var(--knk-mail-c-green-03);color:var(--knk-mail-c-green-76);font-weight:700}
  .mv-rc .mv-me.bcc{margin:0 0 0 2px;font-size:11px;padding:0 7px;line-height:1.75;border-radius:999px;font-weight:600;white-space:nowrap}
  .mv-rc-more{border:0;background:none;color:var(--knk-mail-c-blue-52);font-size:12px;font-weight:600;cursor:pointer;padding:0 4px;white-space:nowrap}
  .mv-hsub .mv-rc-to:has(~ .mv-rc-cc){flex-basis:100%}   /* 참조가 있으면 받는 사람 = 한 줄 · 참조(+시각) = 다음 줄 */
  .mv-hsub .mv-rc{min-width:0}
  .mv-nofrom{font-size:12px;color:var(--knk-mail-c-orange-66);background:var(--knk-mail-c-amber-04);border:1px solid var(--knk-mail-c-orange-28);border-radius:6px;padding:0 6px}
  html[data-mt="dark"] .mv-rc-p{background:var(--knk-mail-c-blue-89);border-color:var(--knk-mail-c-blue-73)}
  html[data-mt="dark"] .mv-rc-p.me{background:var(--knk-mail-c-green-80);border-color:var(--knk-mail-c-green-76);color:var(--knk-mail-c-green-15)}
  /* 11-21 나 묶음 — 📅 본문 날짜 */
  .mv-dates{margin:0 0 10px;padding:8px 12px;border-radius:10px;border:1px solid var(--knk-mail-c-blue-13);background:var(--knk-mail-c-blue-03-2);color:var(--knk-mail-c-blue-67);font-size:12.5px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
  .mv-dates-h{font-weight:800}
  .mv-date{display:inline-flex;flex-wrap:wrap;align-items:center;gap:5px}
  .mv-date.dl b{color:var(--knk-mail-c-red-58)}
  .mv-date .hit{color:var(--knk-mail-c-gray-65)}
  .mv-date .bad{font-weight:700;color:var(--knk-mail-c-orange-63);background:var(--knk-mail-c-amber-04);border:1px solid var(--knk-mail-c-orange-28);border-radius:6px;padding:1px 6px}
  .mv-date .on{font-weight:700;color:var(--knk-mail-c-green-71)}
  .mv-date button{font:inherit;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--knk-mail-c-blue-22);background:var(--knk-mail-c-white);color:var(--knk-mail-c-blue-52);cursor:pointer}
  .mv-date button:hover{filter:brightness(.96)}
  @media print{.mv-dates{display:none}}
  .mv-ct-inline:hover{background:var(--knk-mail-c-violet-05)}
  .mv-ct-inline.on{border-color:var(--mt-line,var(--knk-mail-c-gray-09));color:var(--mt-mute,var(--knk-mail-c-gray-54));background:var(--mt-panel,var(--knk-mail-c-gray-02-2));font-weight:600}
  /* 받은 메일 폴더(11-17) */
  .mv-fd-cur{display:inline-block;padding:0 8px;border-radius:999px;background:var(--knk-mail-c-blue-03-2);color:var(--knk-mail-c-blue-52);font-weight:700;font-size:12px;line-height:1.8}
  .mv-fd-sel{margin-left:6px;font-size:12px;padding:2px 6px;border:1px solid var(--mt-line,var(--knk-mail-c-gray-16));border-radius:6px;background:var(--mt-surface,var(--knk-mail-c-white));max-width:200px}
  .mv-fd-msg{margin-left:6px;font-size:11.5px;color:var(--knk-mail-c-teal-76);font-weight:600}
  @media print{.mv-fd-sel,.mv-fd-msg,.mv-thr{display:none}}
  /* 11-22 밤 「💬 같은 대화」 — 접힌 한 줄 · 펼치면 시간 순서 목록(폴더가 달라도) */
  .mv-thr{display:inline-block;vertical-align:middle;max-width:100%}
  .mv-thr>summary{list-style:none;cursor:pointer;display:inline-block;padding:0 9px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:700;line-height:1.8;color:var(--ink-soft,var(--knk-mail-c-blue-73));background:var(--mt-panel,var(--knk-mail-c-gray-02-4))}
  .mv-thr>summary::-webkit-details-marker{display:none}
  .mv-thr>summary small{font-weight:500;color:var(--mute)}
  .mv-thr[open]{display:block;margin-top:4px}
  .mv-thr-list{margin:6px 0 2px;padding:6px 8px;list-style:none;border:1px solid var(--line);border-radius:10px;background:var(--mt-surface,var(--knk-mail-c-white));max-height:260px;overflow:auto}
  .mv-thr-list li a{display:grid;grid-template-columns:82px minmax(0,150px) minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:3px 4px;border-radius:6px;color:inherit;text-decoration:none;font-size:12.5px}
  .mv-thr-list li a:hover{background:var(--mt-hover,var(--knk-mail-c-gray-04))}
  .mv-thr-list li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mv-thr-list .d{color:var(--mute);font-variant-numeric:tabular-nums}
  .mv-thr-list .f{color:var(--mute);font-size:11.5px;max-width:150px}
  .mv-thr-list li.cur a{background:var(--knk-mail-c-blue-03-2);font-weight:700}
  .mv-thr-list li.cur .f{color:var(--knk-mail-c-blue-52)}
  .mv-thr-list li.out .w{color:var(--knk-mail-c-teal-76)}
  html[data-mt="dark"] .mv-thr-list li.cur a{background:var(--knk-mail-c-blue-82)}
  html[data-mt="dark"] .mv-thr-list li.cur .f{color:var(--knk-mail-c-blue-24)}
  html[data-mt="dark"] .mv-thr-list li.out .w{color:var(--knk-mail-c-green-25)}
  @media(max-width:640px){.mv-thr-list li a{grid-template-columns:62px minmax(0,1fr) auto}.mv-thr-list .w{display:none}}
  /* 11-28 ② 대화 흐름 — 같은 대화 줄 안 작은 그림(받은 = 아래 빈 점 · 보낸 = 위 찬 점 · 사선으로 이음 · 회색 점선 = 내 답장 아직) · 색 = 메일 테마 이름만 */
  .mv-flow{display:inline-flex;align-items:center;gap:4px;margin-left:6px;vertical-align:middle;font-weight:500}
  .mv-flow-svg{display:block;flex:none;overflow:visible}
  .mv-flow-svg .ln{stroke:var(--md-mark,var(--knk-brand));stroke-width:1.6;stroke-linecap:round}
  .mv-flow-svg .wait{stroke:var(--mt-mute,var(--knk-text-muted));stroke-width:1.4;stroke-dasharray:2.5 2.5}
  .mv-flow-svg circle.i{fill:var(--mt-surface,var(--knk-bg-surface));stroke:var(--md-mark,var(--knk-brand));stroke-width:1.5}
  .mv-flow-svg circle.o{fill:var(--md-mark,var(--knk-brand));stroke:var(--md-mark,var(--knk-brand));stroke-width:1.5}
  .mv-flow-svg circle.cur{stroke:var(--mt-text,var(--knk-text-primary));stroke-width:1.8}
  .mv-flow-svg circle.w{fill:var(--mt-surface,var(--knk-bg-surface));stroke:var(--mt-mute,var(--knk-text-muted));stroke-width:1.4;stroke-dasharray:2 2}
  .mv-flow-wait{font-size:11.5px;color:var(--mt-mute,var(--knk-text-muted));white-space:nowrap}
  .mv-flow-more{font-size:11px;color:var(--mt-mute,var(--knk-text-muted))}
  @media(max-width:640px){.mv-flow-svg{max-width:120px}}
  /* 11-28 ③ 보낸 사람 카드 숫자 */
  .mv-who-n{display:flex;flex-direction:column;gap:2px;padding:2px 11px 6px;font-size:12.5px;color:var(--mt-text2,var(--knk-text-secondary));border-bottom:1px solid var(--mt-line,var(--knk-border-subtle));margin-bottom:4px;white-space:normal;max-width:340px}
  .mv-who-n .r{display:block;line-height:1.6}
  .mv-who-n .v{color:var(--mt-text,var(--knk-text-primary));font-variant-numeric:tabular-nums}
  .mv-who-n small,.mv-who-n .s{color:var(--mt-mute,var(--knk-text-muted));font-size:11.5px}
  @media print{.mv-ct-inline{display:none}}
  .mv-badge{font-size:11px;padding:2px 8px;border-radius:6px;margin-left:8px;vertical-align:middle}
  .mv-ai{border:1px solid var(--knk-mail-c-blue-13);background:var(--knk-mail-c-blue-03-2);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--knk-mail-c-blue-67);white-space:pre-wrap;line-height:1.75}
  .mv-body{border:1px solid var(--line);border-radius:12px;background:var(--mt-surface,var(--knk-mail-c-white));padding:18px;white-space:pre-wrap;line-height:1.8;font-size:14px;color:var(--ink)}
  .mv-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;align-items:center}
  /* 11-18 단추 한 줄 + ⋯ 더 보기 */
  .mv-star.on{border-color:var(--knk-mail-c-amber-50);color:var(--knk-mail-c-orange-63);background:var(--knk-mail-c-yellow-04);font-weight:700}
  .mv-star.on .md-i{fill:currentColor}
  .mv-more{position:relative}
  .mv-more>summary{list-style:none;cursor:pointer}
  .mv-more>summary::-webkit-details-marker{display:none}
  .mv-more-box{position:absolute;right:0;top:calc(100% + 4px);z-index:30;background:var(--mt-surface,var(--knk-mail-c-white));border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.14);padding:6px;min-width:230px;display:flex;flex-direction:column}
  .mv-more-box.mv-pop{position:fixed;right:auto;z-index:9400;max-height:calc(100vh - 16px);overflow:auto}   /* 11-22 열 때 화면 기준 자리(mail_view_body.html) */
  .mv-more-box button,.mv-more-box a{display:block;text-align:left;border:0;background:none;padding:8px 11px;border-radius:7px;font-size:13.5px;color:var(--ink);text-decoration:none;cursor:pointer;font-family:inherit;white-space:nowrap}
  .mv-more-box button:hover,.mv-more-box a:hover{background:var(--mt-hover,var(--knk-mail-c-gray-04-2))}
  .mv-more-box .warn{color:var(--knk-mail-c-orange-66)}
  .mv-more-box hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
  .mv-more-box .mv-mob{display:none}   /* 11-21 마 묶음 6-4 — 휴대폰에서만 「⋯ 더 보기」 안에 중요·보관·삭제 */
  @media print{.mv-more{display:none}}
  @media print{ .mv-actions, .mv-nav, .mv-fu, .mv-grp, .mv-reply, .mv-fd, .mv-warn-btn, .mbx-toast, .mail-app-fixed, .mw-close{display:none !important} body,html{background:var(--knk-mail-c-white) !important} }
  /* 11-19 2단계 — 🚩 기한 · ⏰ 다시 알림 · 📋 할 일·일정 상자 */
  .mv-fu>summary.on{background:var(--knk-mail-c-amber-04);border-color:var(--knk-mail-c-orange-28);color:var(--knk-mail-c-orange-60)}
  .mv-fu-box{min-width:360px;max-width:min(460px,92vw);padding:8px 12px 12px;white-space:normal}
  .mv-fu-h{font-size:12.5px;font-weight:800;margin:8px 0 5px;color:var(--ink)}
  .mv-fu-h small{font-weight:500;color:var(--mute);font-size:11.5px}
  .mv-fu-now{font-size:11.5px;font-weight:700;color:var(--knk-mail-c-orange-60);background:var(--knk-mail-c-amber-04);border-radius:6px;padding:1px 6px;margin-left:4px}
  .mv-fu-now.late{color:var(--knk-mail-c-red-58);background:var(--knk-mail-c-red-06)}
  .mv-fu-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .mv-more-box .mv-fu-row button{display:inline-flex;border:1px solid var(--line);border-radius:7px;padding:4px 10px;font-size:12.5px;background:var(--mt-surface,var(--knk-mail-c-white))}
  .mv-more-box .mv-fu-row button.go{background:var(--knk-red);border-color:var(--knk-red);color:var(--knk-mail-c-white);font-weight:700}
  .mv-more-box .mv-fu-row button.x{color:var(--knk-mail-c-orange-66)}
  .mv-fu-row input{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:7px;padding:3px 6px;background:var(--mt-surface,var(--knk-mail-c-white));color:var(--ink)}
  @media(max-width:640px){ .mv-fu-box{position:fixed;left:8px;right:8px;top:auto;bottom:8px;min-width:0;max-width:none} }
  /* 11-23 「✅ 확인 답장」은 단추 줄 왼쪽(답장 옆) → 상자를 왼쪽 끝에 맞춰 오른쪽으로 펼침(오른쪽 맞춤이면 좁은 창에서 왼쪽이 잘림) */
  @media(min-width:641px){ #mvAck > .mv-more-box{left:0;right:auto} }
  /* 11-18 보낸 사람 눌러 모아 보기 · 이전 대화 접기 */
  .mv-who-wrap{position:relative}
  .mv-who{color:var(--knk-mail-c-blue-52);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .mv-who-pop{position:absolute;left:0;top:calc(100% + 6px);z-index:40;background:var(--mt-surface,var(--knk-mail-c-white));border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.14);padding:6px;min-width:260px;display:flex;flex-direction:column}
  .mv-who-pop[hidden]{display:none}
  .mv-who-pop a{padding:8px 11px;border-radius:7px;font-size:13.5px;color:var(--ink);text-decoration:none;white-space:nowrap}
  .mv-who-pop a:hover{background:var(--mt-hover,var(--knk-mail-c-gray-04-2))}
  .mv-who-h{font-size:12px;color:var(--mute);font-weight:700;padding:5px 11px 3px}
  .mv-quote{margin-top:12px;border-top:1px dashed var(--mt-line,var(--knk-mail-c-gray-16-3));padding-top:8px}
  .mv-quote>summary{cursor:pointer;color:var(--mt-mute,var(--knk-mail-c-gray-54));font-size:13px;list-style:none}
  .mv-quote>summary::-webkit-details-marker{display:none}
  .mv-quote[open]>summary{margin-bottom:8px}
  .mv-quote .mv-body{color:var(--mt-text2,var(--knk-mail-c-gray-66))}
  @media print{.mv-who-pop{display:none}.mv-quote{display:block}}
  /* 11-22 대표 「글자 크기 −·＋ 3단계 더」 — 칸 크기는 그대로 · 안쪽(목록 줄·폴더 줄·읽기 칸)만 배율(80%~145% · mail_fs.html) */
  /* 11-23 대표 「칸별로」 — 폴더(--mfz-side) · 목록(--mfz-list) · 읽기 칸·따로 연 메일(--mfz-read · 보기 자리마다 따로 기억) */
  html[data-mfz] .mbx-side > *{zoom:var(--mfz-side,1)}
  html[data-mfz] .mbx-list > *{zoom:var(--mfz-list,1)}
  html[data-mfz] #readPane > *, html[data-mfz] .mv-zoom > *{zoom:var(--mfz-read,1)}
  html[data-mfz] .mbx-side{overflow-x:hidden}   /* 배율 반올림으로 생기는 2~3px 가로 넘침 막기 */
  html.mfb-read .mv-body,html.mfb-read .mv-meta{font-size:16px}
  /* 11-18 3단계 — 이 메일만 폴더 · 이전·다음 */
  .mv-fd-pin{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--knk-mail-c-blue-06);color:var(--knk-mail-c-indigo-59)}
  .mv-fd-undo{font-size:12px;color:var(--knk-mail-c-blue-52);text-decoration:none;margin-left:2px}
  .mv-fd-ask{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap;margin-left:6px;padding:4px 8px;border:1px solid var(--knk-mail-c-blue-11);background:var(--knk-mail-c-blue-03);border-radius:8px;font-size:12.5px}
  .mv-fd-ask[hidden]{display:none}
  .mv-fd-ask button{border:1px solid var(--knk-mail-c-blue-11);background:var(--mt-surface,var(--knk-mail-c-white));border-radius:7px;padding:3px 9px;font-size:12.5px;cursor:pointer;font-family:inherit}
  .mv-fd-ask button.x{border:0;background:none;color:var(--mute)}
  .mv-nav{display:flex;gap:8px;justify-content:space-between;margin:16px 0 4px}
  @media print{.mv-nav,.mv-fd-ask{display:none}}
  html.mfb-read .mv-subj{font-size:22px}
