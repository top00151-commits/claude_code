<style>
  /* 메일 내용 보기 — 풀페이지(mail_view)와 읽기 창(mail_inbox 우측 pane) 공용 */
  .mv-head{border:1px solid var(--line);border-radius:12px;background:var(--mt-surface,#fff);padding:16px 18px;margin-bottom:14px}
  .mv-subj{font-size:18px;font-weight:700;margin:0 0 8px;line-height:1.4}
  .mv-meta{font-size:12.5px;color:var(--mute);line-height:1.85}
  .mv-ct-inline{display:inline-block;margin-left:6px;padding:0 8px;border:1px solid #c4b5fd;border-radius:999px;font-size:11.5px;font-weight:700;color:#6d28d9;background:#f5f3ff;text-decoration:none;line-height:1.7;vertical-align:1px}
  .mv-reply{margin:0 0 10px;font-size:12.5px;color:var(--mt-mute,#6b7280);display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .mv-reply.on{padding:9px 12px;border-radius:10px;border:1px solid #fcd34d;background:#fffbeb;color:#92400e}
  .mv-reply.on.lv2{border-color:#fca5a5;background:#fef2f2;color:#991b1b}
  .mv-reply-why{font-weight:500}
  .mv-reply-btn{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--mt-line,#d1d5db);background:var(--mt-surface,#fff);color:var(--mt-text2,#374151);cursor:pointer;text-decoration:none}
  .mv-reply-btn.mv-reply-go{border-color:#dc2626;background:#dc2626;color:#fff}
  .mv-reply-btn:hover{filter:brightness(.96)}
  @media print{.mv-reply{display:none}}
  .mv-ct-inline:hover{background:#ede9fe}
  .mv-ct-inline.on{border-color:var(--mt-line,#e5e7eb);color:var(--mt-mute,#6b7280);background:var(--mt-panel,#f9fafb);font-weight:600}
  /* 받은 메일 폴더(11-17) */
  .mv-fd-cur{display:inline-block;padding:0 8px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-weight:700;font-size:12px;line-height:1.8}
  .mv-fd-sel{margin-left:6px;font-size:12px;padding:2px 6px;border:1px solid var(--mt-line,#cbd5e1);border-radius:6px;background:var(--mt-surface,#fff);max-width:200px}
  .mv-fd-msg{margin-left:6px;font-size:11.5px;color:#047857;font-weight:600}
  @media print{.mv-fd-sel,.mv-fd-msg{display:none}}
  @media print{.mv-ct-inline{display:none}}
  .mv-badge{font-size:11px;padding:2px 8px;border-radius:6px;margin-left:8px;vertical-align:middle}
  .mv-ai{border:1px solid #bfdbfe;background:#eff6ff;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:#1e3a8a;white-space:pre-wrap;line-height:1.75}
  .mv-body{border:1px solid var(--line);border-radius:12px;background:var(--mt-surface,#fff);padding:18px;white-space:pre-wrap;line-height:1.8;font-size:14px;color:var(--ink)}
  .mv-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;align-items:center}
  /* 11-18 단추 한 줄 + ⋯ 더 보기 */
  .mv-star.on{border-color:#f59e0b;color:#b45309;background:#fffbeb;font-weight:700}
  .mv-more{position:relative}
  .mv-more>summary{list-style:none;cursor:pointer}
  .mv-more>summary::-webkit-details-marker{display:none}
  .mv-more-box{position:absolute;right:0;top:calc(100% + 4px);z-index:30;background:var(--mt-surface,#fff);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.14);padding:6px;min-width:230px;display:flex;flex-direction:column}
  .mv-more-box button,.mv-more-box a{display:block;text-align:left;border:0;background:none;padding:8px 11px;border-radius:7px;font-size:13.5px;color:var(--ink);text-decoration:none;cursor:pointer;font-family:inherit;white-space:nowrap}
  .mv-more-box button:hover,.mv-more-box a:hover{background:var(--mt-hover,#f3f4f6)}
  .mv-more-box .warn{color:#9a3412}
  .mv-more-box hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
  @media print{.mv-more{display:none}}
  @media print{ .mv-actions, .mv-nav, .mv-fu, .mv-grp, .mv-reply, .mv-fd, .mv-warn-btn, .mbx-toast, .mail-app-fixed, .mw-close{display:none !important} body,html{background:#fff !important} }
  /* 11-19 2단계 — 🚩 기한 · ⏰ 다시 알림 · 📋 할 일·일정 상자 */
  .mv-fu>summary.on{background:#fff7ed;border-color:#fdba74;color:#c2410c}
  .mv-fu-box{min-width:360px;max-width:min(460px,92vw);padding:8px 12px 12px;white-space:normal}
  .mv-fu-h{font-size:12.5px;font-weight:800;margin:8px 0 5px;color:var(--ink)}
  .mv-fu-h small{font-weight:500;color:var(--mute);font-size:11.5px}
  .mv-fu-now{font-size:11.5px;font-weight:700;color:#c2410c;background:#fff7ed;border-radius:6px;padding:1px 6px;margin-left:4px}
  .mv-fu-now.late{color:#b91c1c;background:#fee2e2}
  .mv-fu-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .mv-more-box .mv-fu-row button{display:inline-flex;border:1px solid var(--line);border-radius:7px;padding:4px 10px;font-size:12.5px;background:var(--mt-surface,#fff)}
  .mv-more-box .mv-fu-row button.go{background:var(--knk-red,#a5282c);border-color:var(--knk-red,#a5282c);color:#fff;font-weight:700}
  .mv-more-box .mv-fu-row button.x{color:#9a3412}
  .mv-fu-row input{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:7px;padding:3px 6px;background:var(--mt-surface,#fff);color:var(--ink)}
  @media(max-width:640px){ .mv-fu-box{position:fixed;left:8px;right:8px;top:auto;bottom:8px;min-width:0;max-width:none} }
  /* 11-18 보낸 사람 눌러 모아 보기 · 이전 대화 접기 */
  .mv-who-wrap{position:relative}
  .mv-who{color:#1d4ed8;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .mv-who-pop{position:absolute;left:0;top:calc(100% + 6px);z-index:40;background:var(--mt-surface,#fff);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.14);padding:6px;min-width:260px;display:flex;flex-direction:column}
  .mv-who-pop[hidden]{display:none}
  .mv-who-pop a{padding:8px 11px;border-radius:7px;font-size:13.5px;color:var(--ink);text-decoration:none;white-space:nowrap}
  .mv-who-pop a:hover{background:var(--mt-hover,#f3f4f6)}
  .mv-who-h{font-size:12px;color:var(--mute);font-weight:700;padding:5px 11px 3px}
  .mv-quote{margin-top:12px;border-top:1px dashed var(--mt-line,#d1d5db);padding-top:8px}
  .mv-quote>summary{cursor:pointer;color:var(--mt-mute,#6b7280);font-size:13px;list-style:none}
  .mv-quote>summary::-webkit-details-marker{display:none}
  .mv-quote[open]>summary{margin-bottom:8px}
  .mv-quote .mv-body{color:var(--mt-text2,#4b5563)}
  @media print{.mv-who-pop{display:none}.mv-quote{display:block}}
  html.mbx-big .mv-body,html.mbx-big .mv-meta{font-size:16px}
  /* 11-18 3단계 — 이 메일만 폴더 · 이전·다음 */
  .mv-fd-pin{font-size:11px;padding:1px 7px;border-radius:6px;background:#e0e7ff;color:#3730a3}
  .mv-fd-undo{font-size:12px;color:#1d4ed8;text-decoration:none;margin-left:2px}
  .mv-fd-ask{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap;margin-left:6px;padding:4px 8px;border:1px solid #c7d2fe;background:#eef2ff;border-radius:8px;font-size:12.5px}
  .mv-fd-ask[hidden]{display:none}
  .mv-fd-ask button{border:1px solid #c7d2fe;background:var(--mt-surface,#fff);border-radius:7px;padding:3px 9px;font-size:12.5px;cursor:pointer;font-family:inherit}
  .mv-fd-ask button.x{border:0;background:none;color:var(--mute)}
  .mv-nav{display:flex;gap:8px;justify-content:space-between;margin:16px 0 4px}
  @media print{.mv-nav,.mv-fd-ask{display:none}}
  html.mbx-big .mv-subj{font-size:22px}
  .mv-trans{border:1px dashed #c7d2fe;background:#f5f7ff;border-radius:10px;padding:12px 14px;margin-top:12px;display:none}
  .mv-viewtabs{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .mv-vtab{font-size:12.5px;padding:5px 12px;border:1px solid var(--line);border-radius:8px;background:var(--mt-surface,#fff);cursor:pointer}
  .mv-vtab.active{background:var(--knk-red,#c0392b);color:#fff;border-color:transparent}
  .mv-vnote{font-size:11.5px;color:var(--mute)}
  .mv-frame{width:100%;min-height:240px;border:1px solid var(--line);border-radius:12px;background:var(--mt-surface,#fff)}
  .mv-atts{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--mt-surface,#fff);padding:12px 14px}
  .mv-atts-h{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:8px}
  .mv-att{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:4px 6px 0 0;font-size:12.5px;color:var(--ink);text-decoration:none;background:var(--mt-panel,#fafafa)}
  .mv-att:hover{background:#f0f0f0}
  .mv-att-sz{color:var(--mute);font-size:11px}
  /* 첨부 이미지 인라인 미리보기 (대표 지시 2026-06-14 Phase4) */
  .mv-att-img{display:inline-block;vertical-align:top;margin:6px 8px 0 0;border:1px solid var(--line);border-radius:9px;overflow:hidden;text-decoration:none;background:var(--mt-panel,#fafafa);width:140px}
  .mv-att-img img{display:block;width:140px;height:104px;object-fit:cover;background:#f0f0f0}
  .mv-att-img:hover{border-color:var(--knk-red)}
  .mv-att-cap{display:block;font-size:11px;color:var(--mute);padding:3px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 위험 메일 경고배너 (스팸·피싱 방어 2026-06-19) */
  .mv-warn{border-radius:10px;padding:11px 14px;margin-bottom:12px;font-size:13px;line-height:1.65;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .mv-warn.high{background:#fef2f2;border:1px solid #fca5a5;color:#b91c1c;font-weight:600}
  .mv-warn.low{background:var(--mt-panel,#f8fafc);border:1px solid var(--line);color:var(--mute)}
  .mv-warn-btn{margin-left:auto;border:1px solid currentColor;background:transparent;color:inherit;font-size:12px;font-weight:700;padding:5px 11px;border-radius:7px;cursor:pointer;white-space:nowrap}
  .mv-att.danger{border-color:#fca5a5;background:#fef2f2;color:#b91c1c;font-weight:600}
  /* ── 2단계 아웃룩식 읽기 칸(11-18) — 제목 → 보낸 사람 줄 + 오른쪽 답장 단추 → 작은 표시 한 줄 → 첨부 → 본문 ── */
  .mv-head{padding:14px 16px 10px}
  .mv-head .mv-subj{font-size:19px;line-height:1.35;margin:0 0 12px}
  /* 11-20 대표 「주소가 아랫쪽으로만 · 오른쪽 여백은 많은데」 — 머리를 격자(grid)로:
     1줄 = 첫 글자 · 보낸 사람 · (오른쪽) 단추 줄 / 2줄부터 = 그룹 메일 상자 · 받는 사람·참조 줄이 단추 줄 아래까지 머리 전체 너비를 씀.
     .mv-hwho 는 display:contents — 안의 칸(.mv-hname·#mvGrp·#mvHsub)이 바로 격자 칸이 됨(HTML·id·JS 그대로) */
  .mv-hrow{display:grid;grid-template-columns:40px minmax(0,1fr) fit-content(62%);grid-template-rows:auto auto auto;column-gap:12px;align-items:start}
  .mv-av{grid-column:1;grid-row:1 / 4;width:40px;height:40px;border-radius:50%;background:#dbe4ff;color:#1e3a8a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
  .mv-hwho{display:contents;font-size:13.5px;line-height:1.55}
  .mv-hname{grid-column:2;grid-row:1;min-width:0;padding-top:2px;font-weight:700;overflow-wrap:anywhere}
  .mv-hname .mv-who{font-weight:800}
  .mv-hrow > .mv-hwho > .mv-grp{grid-column:2 / -1;grid-row:2;min-width:0}
  .mv-hsub{grid-column:2 / -1;grid-row:3;min-width:0;margin-top:3px;color:var(--mute);font-size:12.5px;overflow-wrap:anywhere}   /* 주소 가운데서 끊지 않고 「, 」 뒤에서 줄 바꿈 */
  /* 11-19 1단계 ④ 받는 사람 중 회사 그룹 메일 — 누가 받았는지 */
  .mv-grp{display:flex;flex-direction:column;gap:3px;margin:6px 0 2px}
  .mv-grp[hidden]{display:none}
  .mv-grp-i{font-size:12.5px;color:#1e3a8a;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:4px 9px}
  .mv-grp-i button{font:inherit;font-size:12px;font-weight:700;border:0;background:transparent;color:inherit;text-decoration:underline;cursor:pointer}
  .mv-grp-p{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .mv-grp-p[hidden]{display:none}
  .mv-grp-p span{background:#fff;border:1px solid #bfdbfe;border-radius:999px;padding:1px 8px}
  html[data-mt="dark"] .mv-grp-i{background:#1e293b;border-color:#334155;color:#bfdbfe}
  html[data-mt="dark"] .mv-grp-p span{background:#0f172a;border-color:#334155}
  .mv-hrow .mv-actions{grid-column:3;grid-row:1;min-width:0;margin:0;padding:0;border:0;background:none;display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
  .mv-hrow .mv-actions .btn{padding:5px 10px;font-size:12.5px}
  .mv-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 0 52px;font-size:12.5px}
  .mv-chips .mv-fd-cur{border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--mt-panel,#fafafa)}
  .mv-chip{border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--mt-panel,#fafafa);color:var(--mt-text2,#374151)}
  .mv-chip.ext{border-color:var(--mt-line,#e5e7eb);color:var(--mt-mute,#6b7280)}
  .mv-atts{margin-top:8px}
  .mv-viewtabs[hidden]{display:none !important}
  @media(max-width:640px){.mv-chips{margin-left:0}.mv-hrow .mv-actions{justify-content:flex-start}
    /* 폰: 첫 글자·보낸 사람 → 그룹 메일·받는 사람(전체 너비) → 단추(큼직하게 2개씩) */
    .mv-hrow{grid-template-columns:40px minmax(0,1fr);grid-template-rows:auto auto auto auto}
    .mv-av{grid-row:1 / 2}
    .mv-hrow > .mv-hwho > .mv-grp, .mv-hsub{grid-column:1 / -1}
    .mv-hrow .mv-actions{grid-column:1 / -1;grid-row:4;margin-top:10px}}
  .mv-att.warnf{border-color:#fde68a;background:#fffbeb}
  .mv-imgoff{margin:8px 0;padding:6px 10px;border:1px dashed var(--mt-line,#cbd5e1);border-radius:8px;font-size:12.5px;color:var(--mt-text2,#475569);background:var(--mt-panel,#f8fafc)}
  .mv-imgoff button{margin-left:6px;border:1px solid var(--mt-line,#cbd5e1);background:var(--mt-surface,#fff);border-radius:7px;padding:2px 10px;font:inherit;font-size:12px;cursor:pointer}
  /* 주소록에 등록 — 서명에서 읽어 채운 칸 (대표 지시 2026-11-16) */
  .mv-contact{border:1px solid #ddd6fe;background:#faf8ff;border-radius:12px;padding:14px 16px;margin:0 0 14px}
  .mvc-h{font-size:14px;font-weight:700;color:#5b21b6;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .mvc-msg{font-size:12.5px;font-weight:500;color:#6d28d9}
  .mvc-notes{font-size:12.5px;color:var(--mute);line-height:1.7;margin-top:4px}
  .mvc-dup{color:#b45309;font-weight:600}
  .mvc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 12px;margin-top:10px}
  .mvc-grid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute);font-weight:600;min-width:0}
  .mvc-grid label.full{grid-column:1/-1}
  .mvc-grid input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px;font-family:inherit;background:var(--mt-surface,#fff);color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
  .mvc-grid input.mvc-auto{background:#f0fdf4;border-color:#86efac}
  .mvc-line{display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink);margin-top:10px}
  .mvc-line label{display:inline-flex;gap:4px;align-items:center;cursor:pointer}
  .mvc-dim{font-size:11.5px;color:var(--mute);font-weight:400}
  .mvc-sig{margin-top:10px;font-size:12.5px;color:var(--mute)}
  .mvc-sig summary{cursor:pointer}
  .mvc-sig textarea{display:block;width:100%;box-sizing:border-box;margin:8px 0;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-family:inherit;font-size:13px;line-height:1.6;resize:vertical;background:var(--mt-surface,#fff);color:var(--ink)}
  .mvc-btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .mvc-done{font-size:12.5px;color:#15803d;font-weight:600;align-self:center}
  @media(max-width:640px){ .mvc-grid{grid-template-columns:1fr 1fr;gap:7px 9px} .mvc-grid label.wide{grid-column:1/-1} .mv-contact{padding:12px} }
  /* ── 폰(≤640px): 메일 읽기 — 여백·글씨 폰 크기, 버튼 2개씩 큼직 (대표 지시 2026-06-14 모바일) ── */
  @media(max-width:640px){
    .mv-head{padding:13px 14px;border-radius:10px;margin-bottom:10px}
    .mv-subj{font-size:16px;line-height:1.35}
    .mv-meta{font-size:12px;line-height:1.7}
    .mv-badge{font-size:10.5px}
    .mv-ai{padding:12px;font-size:13px;border-radius:10px}
    .mv-body{padding:14px;font-size:14.5px;border-radius:10px}
    .mv-actions{gap:7px;margin:12px 0}
    .mv-actions .btn{flex:1 1 46%;min-width:0;text-align:center;padding:10px 6px;font-size:13px}
    .mv-actions>span[style*="flex:1"]{display:none}   /* 데스크톱용 가로 스페이서는 폰에서 숨김 */
    .mv-viewtabs{gap:6px}
    .mv-vtab{font-size:12.5px;padding:7px 12px}
    .mv-vnote{display:none}                            /* 좁은 폰에선 안내문 숨겨 공간 확보 */
    .mv-frame{min-height:200px;border-radius:10px}
    .mv-atts{padding:11px 12px;border-radius:10px}
    .mv-att-img{width:46%}                             /* 이미지 첨부 2장씩 */
    .mv-att-img img{width:100%;height:92px}
    .mv-att{font-size:12px}
  }
  /* 인쇄/PDF — 메뉴·버튼·번역창은 숨기고 메일 본문만 깔끔히 (대표 지시 2026-06-14) */
  @media print {
    .mail-app-top, .mv-actions, .mv-viewtabs, .mv-trans, .page-head, .mv-contact { display:none !important; }
    .mv-head, .mv-body, .mv-atts, .mv-ai { border:0 !important; box-shadow:none !important; padding:0 !important; }
    .mv-frame { border:0 !important; }
    body, .app, .main { margin:0 !important; padding:0 !important; background:var(--mt-surface,#fff) !important; }
  }
  /* 11-20 👉 맡기기(이음 요청) — 상태 띠 · 맡기기 창 */
  .mv-dlg{margin:-6px 0 12px;display:flex;flex-direction:column;gap:6px}
  .mv-dlg[hidden]{display:none}
  .mv-dlg-i{padding:8px 12px;border-radius:10px;border:1px solid #c7d2fe;background:#eef2ff;color:#312e81;font-size:13px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
  .mv-dlg-i.dim{border-style:dashed;background:transparent;color:var(--mt-mute,#6b7280)}
