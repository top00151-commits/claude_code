<style>
  /* 메일 내용 보기 — 풀페이지(mail_view)와 읽기 창(mail_inbox 우측 pane) 공용 */
  .mv-head{border:1px solid var(--line);border-radius:12px;background:#fff;padding:16px 18px;margin-bottom:14px}
  .mv-subj{font-size:18px;font-weight:700;margin:0 0 8px;line-height:1.4}
  .mv-meta{font-size:12.5px;color:var(--mute);line-height:1.85}
  .mv-badge{font-size:11px;padding:2px 8px;border-radius:6px;margin-left:8px;vertical-align:middle}
  .mv-ai{border:1px solid #bfdbfe;background:#eff6ff;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:#1e3a8a;white-space:pre-wrap;line-height:1.75}
  .mv-body{border:1px solid var(--line);border-radius:12px;background:#fff;padding:18px;white-space:pre-wrap;line-height:1.8;font-size:14px;color:var(--ink)}
  .mv-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;align-items:center}
  .mv-trans{border:1px dashed #c7d2fe;background:#f5f7ff;border-radius:10px;padding:12px 14px;margin-top:12px;display:none}
  .mv-viewtabs{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .mv-vtab{font-size:12.5px;padding:5px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
  .mv-vtab.active{background:var(--knk-red,#c0392b);color:#fff;border-color:transparent}
  .mv-vnote{font-size:11.5px;color:var(--mute)}
  .mv-frame{width:100%;min-height:240px;border:1px solid var(--line);border-radius:12px;background:#fff}
  .mv-atts{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px}
  .mv-atts-h{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:8px}
  .mv-att{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:4px 6px 0 0;font-size:12.5px;color:var(--ink);text-decoration:none;background:#fafafa}
  .mv-att:hover{background:#f0f0f0}
  .mv-att-sz{color:var(--mute);font-size:11px}
  /* 첨부 이미지 인라인 미리보기 (대표 지시 2026-06-14 Phase4) */
  .mv-att-img{display:inline-block;vertical-align:top;margin:6px 8px 0 0;border:1px solid var(--line);border-radius:9px;overflow:hidden;text-decoration:none;background:#fafafa;width:140px}
  .mv-att-img img{display:block;width:140px;height:104px;object-fit:cover;background:#f0f0f0}
  .mv-att-img:hover{border-color:var(--knk-red)}
  .mv-att-cap{display:block;font-size:11px;color:var(--mute);padding:3px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* ── 폰(≤640px): 메일 읽기 — 여백·글씨 폰 크기, 버튼 2개씩 큼직 (대표 지시 2026-06-14 모바일) ── */
  @media(max-width:640px){
    .mv-head{padding:13px 14px;border-radius:10px;margin-bottom:10px}
    .mv-subj{font-size:16px;line-height:1.35}
    .mv-meta{font-size:12px;line-height:1.7}
    .mv-badge{font-size:10.5px}
    .mv-ai{padding:12px;font-size:13px;border-radius:10px}
    .mv-body{padding:14px;font-size:14.5px;border-radius:10px}
    .mv-actions{gap:7px;margin:12px 0}
    .mv-actions .btn{flex:1 1 46%;min-width:0;text-align:center;padding:10px 6px;font-size:13px}
    .mv-actions>span[style*="flex:1"]{display:none}   /* 데스크톱용 가로 스페이서는 폰에서 숨김 */
    .mv-viewtabs{gap:6px}
    .mv-vtab{font-size:12.5px;padding:7px 12px}
    .mv-vnote{display:none}                            /* 좁은 폰에선 안내문 숨겨 공간 확보 */
    .mv-frame{min-height:200px;border-radius:10px}
    .mv-atts{padding:11px 12px;border-radius:10px}
    .mv-att-img{width:46%}                             /* 이미지 첨부 2장씩 */
    .mv-att-img img{width:100%;height:92px}
    .mv-att{font-size:12px}
  }
  /* 인쇄/PDF — 메뉴·버튼·번역창은 숨기고 메일 본문만 깔끔히 (대표 지시 2026-06-14) */
  @media print {
    .mail-app-top, .mv-actions, .mv-viewtabs, .mv-trans, .page-head { display:none !important; }
    .mv-head, .mv-body, .mv-atts, .mv-ai { border:0 !important; box-shadow:none !important; padding:0 !important; }
    .mv-frame { border:0 !important; }
    body, .app, .main { margin:0 !important; padding:0 !important; background:#fff !important; }
  }
</style>
