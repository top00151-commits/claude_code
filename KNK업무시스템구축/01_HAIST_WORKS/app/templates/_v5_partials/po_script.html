{# z1191z143: 고객 발주서 — 올리기(단추·끌어다 놓기) · 빼기 · 「확인했음」 공용 스크립트(문서에 한 번 · 화면 바꿈으로 다시 들어와도 한 번) #}
<script>(function(){
  if (window.__z143po) return; window.__z143po = 1;
  var OK_EXT = /\.(pdf|png|jpe?g|xlsx|xlsm|xls)$/i;
  function msgOf(box){ return box && box.querySelector('.z143-msg'); }
  function say(box, t, bad){ var m = msgOf(box); if (m) { m.style.color = bad ? '#b91c1c' : '#475569'; m.textContent = t; } else if (bad) { alert(t); } }
  function post(url, fd){ return fetch(url, {method:'POST', body: fd || new FormData(), credentials:'same-origin'}).then(function(r){ return r.json().catch(function(){ return {ok:false}; }); }); }
  function upload(box, file){
    if (!box || !file) return;
    if (!OK_EXT.test(file.name || '')) { say(box, '고객 발주서는 PDF · 사진(jpg·png) · 엑셀(xlsx·xls) 파일만 올릴 수 있습니다.', true); return; }
    if (file.size > 20*1024*1024) { say(box, '20MB 보다 큰 파일은 올릴 수 없습니다.', true); return; }
    /* z1191z156: 수주번호 고르는 칸이 있으면(프로젝트 상세 「고객 발주서」) 그 값 · 안 골랐으면 올리지 않음 */
    var sel = box.querySelector('.z156-so-sel'), up = box.querySelector('.z143-upw'), sid = up && up.getAttribute('data-step');
    function step(n, t){ if (sid && window.z156Step) window.z156Step(sid, n, t); }
    var oid = sel ? sel.value : (box.getAttribute('data-oid') || '');
    if (sel && !oid) { say(box, '👉 수주번호를 골라 주세요 — 발주서는 수주번호에만 붙습니다(저장하지 않았습니다).', true); step(1, '👉 지금 하실 일: 수주번호를 고른 뒤 다시 올리세요'); try { sel.focus(); } catch (e) {} return; }
    var soTxt = sel ? ((sel.options[sel.selectedIndex] || {}).textContent || '').split(' · ')[0] : '';
    var fd = new FormData(); fd.append('file', file); fd.append('pid', box.getAttribute('data-pid') || ''); fd.append('order_id', oid);
    say(box, '⏳ 올리는 중…'); step(2, '⏳ 진행 중 — 「' + (file.name || '') + '」을 ' + soTxt + ' 에 올리는 중입니다');
    post('/api/customer-po/upload', fd).then(function(j){
      if (j && (j.need_so || j.no_so)) { say(box, j.message || '👉 수주번호를 골라 주세요.', true); step(1, j.message || '👉 수주번호를 골라 주세요'); return; }
      if (!j || !j.ok) { say(box, '⚠ 끝나지 않았습니다 — ' + ((j && j.message) || '올리지 못했습니다 — 다시 해 보세요.'), true); step(3, '⚠ 끝나지 않았습니다 — 다시 올려 주세요'); return; }
      say(box, '✅ 완료 — ' + (j.slot || '') + '에 올렸습니다' + (j.prev ? ' (예전 발주서 ' + j.prev + '장은 「이전 발주서」로 남김)' : '') + ' — 다시 불러옵니다…');
      step(4, '✅ 완료 — ' + (j.slot || '') + ' 에 붙었습니다 (엑셀 금액이 수주와 다르면 그 수주 줄에 ⚠ 로 보입니다)');
      setTimeout(function(){ location.reload(); }, 900);
    }).catch(function(){ say(box, '⚠ 인터넷 연결이 끊겨 올리지 못했습니다 — 다시 올려 주세요.', true); step(3, '⚠ 끝나지 않았습니다 — 다시 올려 주세요'); });
  }
  document.addEventListener('click', function(e){
    var t = e.target.closest && e.target.closest('.z143-up');
    if (t) { var box = t.closest('.z143-box'); var sl = box && box.querySelector('.z156-so-sel');
      if (sl && !sl.value) { say(box, '👉 수주번호를 골라 주세요 — 발주서는 수주번호에만 붙습니다.', true); try { sl.focus(); } catch (e) {} return; }   /* z1191z156 */
      var fi = box && box.querySelector('.z143-file'); if (fi) fi.click(); return; }
    var rm = e.target.closest && e.target.closest('.z143-rm');
    if (rm) {
      if (!window.confirm('「' + rm.getAttribute('data-name') + '」 발주서를 뺄까요?\n빼면 파일이 바로 지워지고 되돌릴 수 없습니다(누가 뺐는지는 변경 이력에 남습니다).\n최종 발주서를 빼면 바로 앞 발주서가 다시 최종이 됩니다.')) return;
      rm.disabled = true;
      post('/api/customer-po/remove/' + rm.getAttribute('data-fid')).then(function(j){
        if (j && j.ok) { var back = rm.getAttribute('data-back'); if (back) location.href = back; else location.reload(); } else { rm.disabled = false; alert((j && j.message) || '빼지 못했습니다 — 다시 해 보세요.'); }
      }).catch(function(){ rm.disabled = false; alert('인터넷 연결이 끊겨 빼지 못했습니다.'); });
      return;
    }
    var ak = e.target.closest && e.target.closest('.z143-ack');
    if (ak) {
      if (!window.confirm('발주서 금액과 수주 금액이 다른 것을 확인했습니까?\n(맞는 발주서라면 「확인」 — 누가 확인했는지 남습니다)')) return;
      ak.disabled = true;
      post('/api/customer-po/ack/' + ak.getAttribute('data-fid')).then(function(j){
        if (j && j.ok) location.reload(); else { ak.disabled = false; alert((j && j.message) || '저장하지 못했습니다.'); }
      });
    }
  });
  document.addEventListener('change', function(e){
    var fi = e.target;
    if (fi.classList && fi.classList.contains('z156-so-sel')) {   /* z1191z156: 수주번호를 고르면 다음 할 일 */
      var bx = fi.closest('.z143-box'), u2 = bx && bx.querySelector('.z143-upw'), s2 = u2 && u2.getAttribute('data-step');
      if (s2 && window.z156Step) window.z156Step(s2, fi.value ? 2 : 1, fi.value ? '👉 지금 하실 일: 「＋ 발주서 올리기」를 누르거나 파일을 끌어다 놓으세요 — ' + ((fi.options[fi.selectedIndex] || {}).textContent || '').split(' · ')[0] + ' 에 붙습니다' : '👉 지금 하실 일: 이 발주서를 붙일 수주번호를 고르세요');
      return;
    }
    if (!fi.classList || !fi.classList.contains('z143-file')) return;
    var f = fi.files && fi.files[0]; fi.value = '';
    upload(fi.closest('.z143-box'), f);
  });
  document.addEventListener('dragover', function(e){ var b = e.target.closest && e.target.closest('.z143-box'); if (b && b.querySelector('.z143-file')) { e.preventDefault(); b.classList.add('over'); } });
  document.addEventListener('dragleave', function(e){ var b = e.target.closest && e.target.closest('.z143-box'); if (b && !(e.relatedTarget && b.contains(e.relatedTarget))) b.classList.remove('over'); });
  document.addEventListener('drop', function(e){
    var b = e.target.closest && e.target.closest('.z143-box');
    if (!b || !b.querySelector('.z143-file')) return;
    e.preventDefault(); e.stopPropagation(); b.classList.remove('over');
    upload(b, e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
  }, true);
})();</script>
