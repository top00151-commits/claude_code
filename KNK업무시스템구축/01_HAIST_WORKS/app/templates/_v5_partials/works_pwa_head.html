{# v5H226z422 (대표 지시): KNK Eum WORKS = 설치형 앱(PWA) head — 바탕화면/홈 아이콘·독립 창 설치.
   styles.html 에서 1곳 include 로 전 페이지 <head> 에 적용(메일 페이지는 자체 PWA라 제외). #}
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#A5282C">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KNK Eum WORKS">
<script>
(function(){
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function(){});
    });
  }
  // 설치 프롬프트 — 브라우저가 설치 가능 판단 시 이벤트 보관 → 상단바 '📲 앱 설치' 버튼이 사용
  window.__knkWorksInstall = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); window.__knkWorksInstall = e;
    var b = document.getElementById('worksInstallBtn'); if (b) b.style.display = '';
  });
  window.addEventListener('appinstalled', function(){
    window.__knkWorksInstall = null;
    var b = document.getElementById('worksInstallBtn'); if (b) b.style.display = 'none';
  });
  window.worksInstallApp = function(){
    var p = window.__knkWorksInstall;
    if (p) {
      p.prompt();
      (p.userChoice || Promise.resolve()).finally(function(){
        window.__knkWorksInstall = null;
        var b = document.getElementById('worksInstallBtn'); if (b) b.style.display = 'none';
      });
    } else {
      alert('앱으로 설치하기 (KNK Eum WORKS)\n\n• 아이폰·아이패드(사파리): 아래 공유 버튼 → "홈 화면에 추가"\n• 안드로이드·PC(크롬/엣지): 주소창의 설치 아이콘 또는 브라우저 메뉴 → "앱 설치"\n\n(이미 설치돼 있으면 이 안내만 보입니다.)');
    }
  };
})();
</script>
