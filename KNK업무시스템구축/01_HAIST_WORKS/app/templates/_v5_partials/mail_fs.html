{# 11-22 대표 「글자 크게 양옆에 −·＋ · 양쪽 다 3단계 더」 — 8단계 80%~145% · 이 기기에만(localStorage knkmail.fs)
   0 = 보통(100%) · 1 = 예전 「글자 크게」(110% · knkmail.big=1 이던 기기는 1로 시작) · −1~−3 작게 · 2~4 더 크게
   크기는 메일 목록·왼쪽 폴더·읽기 칸(본문 포함) 안쪽만 키운다(줄 높이도 함께 · 칸 크기는 그대로) — 본문 안에 두어야 화면 전환 때도 돈다 #}
<script>
window.MAIL_FS=[[-3,.8,80],[-2,.87,87],[-1,.93,93],[0,1,100],[1,1,110],[2,1.1,120],[3,1.2,130],[4,1.33,145]];
window.mailFsLevel=function(){ var L=0; try{ var v=localStorage.getItem('knkmail.fs');
    if(v===null || v===''){ L=(localStorage.getItem('knkmail.big')==='1') ? 1 : 0; } else { L=parseInt(v,10)||0; } }catch(e){}
  return Math.max(-3, Math.min(4, L)); };
window.mailFsPct=function(L){ var p=100; MAIL_FS.forEach(function(x){ if(x[0]===L) p=x[2]; }); return p; };
window.mailFsApply=function(){ var L=mailFsLevel(), d=document.documentElement, z=1; MAIL_FS.forEach(function(x){ if(x[0]===L) z=x[1]; });
  d.classList.toggle('mbx-big', L>=1);
  if(z!==1){ d.setAttribute('data-mfz', String(L)); d.style.setProperty('--mfz', String(z)); } else { d.removeAttribute('data-mfz'); d.style.removeProperty('--mfz'); }
  if(window.mailFsShow) try{ mailFsShow(); }catch(e){}
  return L; };
window.mailFsSet=function(L){ L=Math.max(-3, Math.min(4, L|0)); try{ localStorage.setItem('knkmail.fs', String(L)); localStorage.removeItem('knkmail.big'); }catch(e){} return mailFsApply(); };
window.mailFsStep=function(d){ return mailFsSet(mailFsLevel()+d); };
try{ mailFsApply(); }catch(e){}
</script>
