{# 11-20 3단계 ⑨ 처음 쓰는 사람 안내 — 받은편지함을 처음 열면 한 번(넘겨 보기 5~6장)
   「다시 보지 않기」·「✓ 시작하기」 = 서버(사용자별 · /api/mail/tour) → 다른 컴퓨터·휴대폰에서도 안 뜸
   「✕ 닫기」 = 이번만(이 창에서만 다시 안 뜸) · ❔ 도움말 「🎓 처음 안내 다시 보기」로 언제든 · 👉 맡기기 장은 시험 명단에게만 #}
<style>
  .mtour{position:fixed;inset:0;z-index:9800;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px}
  .mtour[hidden]{display:none}
  .mtour-box{width:min(460px,100%);background:var(--mt-surface,#fff);color:var(--mt-text,#1f2937);border-radius:16px;box-shadow:0 18px 48px rgba(0,0,0,.25);
    padding:20px 20px 14px;display:flex;flex-direction:column;gap:10px;max-height:calc(100dvh - 32px);overflow:auto}
  .mtour-top{display:flex;align-items:center;gap:8px}
  .mtour-step{font-size:12px;color:var(--mt-mute,#6b7280)}
  .mtour-x{margin-left:auto;border:0;background:none;font-size:18px;cursor:pointer;color:var(--mt-mute,#6b7280);padding:2px 6px;border-radius:6px}
  .mtour-x:hover{background:var(--mt-hover,#f1f5f9)}
  .mtour-ic{font-size:40px;line-height:1}
  .mtour-h{font-size:18px;font-weight:800;margin:0}
  .mtour-b{font-size:14px;line-height:1.75}
  .mtour-b ul{margin:0;padding-left:18px}
  .mtour-dots{display:flex;gap:6px;justify-content:center;padding:4px 0}
  .mtour-dots i{width:8px;height:8px;border-radius:50%;background:var(--mt-line,#e5e7eb)}
  .mtour-dots i.on{background:var(--knk-red,#b91c1c)}
  .mtour-act{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .mtour-act .sp{flex:1}
  .mtour-act button{font:inherit;font-size:13.5px;border-radius:9px;padding:8px 14px;cursor:pointer;border:1px solid var(--mt-line,#d1d5db);background:var(--mt-surface,#fff);color:inherit}
  .mtour-act .go{background:var(--knk-red,#b91c1c);border-color:var(--knk-red,#b91c1c);color:#fff;font-weight:700}
  .mtour-act .nv{border:0;background:none;color:var(--mt-mute,#6b7280);text-decoration:underline;padding:8px 4px}
  .mtour-act button[hidden]{display:none}
  @media(max-width:480px){.mtour-box{padding:16px 14px 12px}.mtour-h{font-size:16.5px}.mtour-b{font-size:13.5px}}
</style>
<div class="mtour" id="mailTour" hidden role="dialog" aria-modal="true" aria-labelledby="mtourH">
  <div class="mtour-box">
    <div class="mtour-top"><span class="mtour-step" id="mtourStep"></span><button type="button" class="mtour-x" onclick="mailTourClose()" title="닫기(이번만) — ❔ 도움말에서 다시 볼 수 있어요">✕</button></div>
    <div class="mtour-ic" id="mtourIc"></div>
    <h3 class="mtour-h" id="mtourH"></h3>
    <div class="mtour-b" id="mtourB"></div>
    <div class="mtour-dots" id="mtourDots"></div>
    <div class="mtour-act">
      <button type="button" class="nv" onclick="mailTourDone()" title="이 안내를 다시 띄우지 않음(다른 컴퓨터·휴대폰에서도)">다시 보지 않기</button>
      <span class="sp"></span>
      <button type="button" id="mtourPrev" onclick="mailTourGo(-1)">← 이전</button>
      <button type="button" class="go" id="mtourNext" onclick="mailTourGo(1)">다음 →</button>
      <button type="button" class="go" id="mtourEnd" onclick="mailTourDone()" hidden>✓ 시작하기</button>
    </div>
  </div>
</div>
<script>
(function(){
  var CARDS=[
    {ic:'📥', h:'받은편지함', b:'<ul><li>메일을 <b>한 번</b> 누르면 옆 칸에서 읽고, <b>두 번</b> 누르면 새 창으로 엽니다.</li><li>메일 위에서 <b>오른쪽 클릭</b> = 답장·전달·보관·삭제 메뉴.</li><li>위 「오늘 챙길 메일」 숫자를 누르면 그 메일만 보입니다.</li></ul>'},
    {ic:'✏️', h:'새 메일 쓰기', b:'<ul><li>위 「✏️ 새 메일」 · 받는사람은 이름 몇 글자만 치면 고를 수 있어요.</li><li>「📝 양식」 = 자주 쓰는 글(노란 빈칸은 Tab 키).</li><li>「✍」에서 서명을 바꾸거나 <b>🏢 회사 서명</b>을 고릅니다.</li><li>「📤 보내기」 뒤 10초 안에는 「↺ 보내기 취소」.</li></ul>'},
    {ic:'👥', h:'그룹 메일 · 받는 사람 묶음', b:'<ul><li>knksales@ 같은 그룹 메일 주소를 넣으면 아래에 <b>누가 받는지</b> 보입니다.</li><li>자주 함께 보내는 사람은 「⚙ 설정·정리」 → 「받는 사람 묶음 · 그룹 메일」에서 묶어 두세요.</li></ul>'},
    {ic:'⏳', h:'답 받기 · ⏱ 예약', b:'<ul><li>바깥 거래처에 보낼 때 「⏳ 답 받기」에서 기한을 고르면, 그때까지 답이 없을 때 알려 드려요. 왼쪽 「⏳ 답 기다림」에 모입니다.</li><li>「⏱ 예약」 = 정한 때에 서버가 보냅니다(창을 닫아도 됨).</li></ul>'},
    {ic:'👉', h:'직원에게 맡기기', dl:true, b:'<ul><li>메일을 열고 「👉 맡기기」 → 담당자·기한·한 줄 지시 → 이음 요청으로 갑니다.</li><li>독촉·결과 확인은 이음 요청에서 합니다(지금은 시험 중이라 일부 직원만 보여요).</li></ul>'},
    {ic:'❔', h:'언제든 다시', b:'<ul><li>위 「❔ 도움말」에서 단축키를 보고, 이 안내를 다시 볼 수 있어요.</li><li><a href="/mail/help" target="_blank" rel="noopener">🖨 설명서(인쇄용)</a>를 열어 종이로 뽑아 두셔도 됩니다.</li></ul>'}
  ];
  var list=CARDS, at=0;
  function el(id){ return document.getElementById(id); }
  function draw(){
    var c=list[at]; if(!c) return;
    el('mtourIc').textContent=c.ic; el('mtourH').textContent=c.h; el('mtourB').innerHTML=c.b;
    el('mtourStep').textContent=(at+1)+' / '+list.length+' · 메일 처음 안내';
    var d=''; for(var i=0;i<list.length;i++) d+='<i class="'+(i===at?'on':'')+'"></i>'; el('mtourDots').innerHTML=d;
    el('mtourPrev').hidden=(at===0); el('mtourNext').hidden=(at===list.length-1); el('mtourEnd').hidden=(at!==list.length-1);
  }
  function show(dl){ list=CARDS.filter(function(c){ return !c.dl || dl; }); at=0; draw(); var t=el('mailTour'); if(t){ t.hidden=false; var n=el('mtourNext'); if(n) try{ n.focus(); }catch(_){} } }
  window.mailTourGo=function(k){ at=Math.max(0,Math.min(list.length-1,at+k)); draw(); };
  window.mailTourClose=function(){ var t=el('mailTour'); if(t) t.hidden=true; try{ sessionStorage.setItem('knkmail.tour.closed','1'); }catch(_){} };
  window.mailTourDone=function(){ var t=el('mailTour'); if(t) t.hidden=true;
    var fd=new FormData(); fd.append('seen','1'); fetch('/api/mail/tour',{method:'POST',body:fd}).catch(function(){}); };
  window.mailTourOpen=function(ev){ if(ev) ev.stopPropagation(); var h=el('mailHelp'); if(h) h.hidden=true;
    fetch('/api/mail/tour').then(function(r){ return r.json(); }).then(function(j){ show(!!(j&&j.dl)); }).catch(function(){ show(false); }); };
  document.addEventListener('keydown', function(e){ var t=el('mailTour'); if(!t||t.hidden) return;
    if(e.key==='Escape'){ mailTourClose(); } else if(e.key==='ArrowRight'){ mailTourGo(1); } else if(e.key==='ArrowLeft'){ mailTourGo(-1); } });
  el('mailTour').addEventListener('click', function(e){ if(e.target===this) mailTourClose(); });
  // 받은편지함을 처음 열었을 때만 저절로(이번에 닫았으면 이 창에선 다시 안 뜸)
  try{
    if(location.pathname.indexOf('/mail/inbox')===0 && sessionStorage.getItem('knkmail.tour.closed')!=='1'){
      fetch('/api/mail/tour').then(function(r){ return r.ok ? r.json() : null; }).then(function(j){ if(j && j.ok && j.show) show(!!j.dl); }).catch(function(){});
    }
  }catch(_){}
})();
</script>
