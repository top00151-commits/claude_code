{# 11-23 메일 쓰기 새 창 공용 함수 — mail_app_head.html 에서 옮김(메일 따로 창 mail_view_win 에도 쓰려고) #}
<script>
/* 11-23 대표 「새 메일 클릭하면 새 창으로 열리게」·「답장·전달도 새 창으로」 — 메일 쓰기를 따로 창으로(보던 목록·메일은 그대로)
   · 공용: 위 도구 줄(mail_app_head) · 받은편지함 · 메일 보기(읽기 칸·메일 따로 창 mail_view_win) 모두 이 함수
   · q = 'reply=12' · 'replyall=12' · 'forward=12' · 'reply=12&ack=…' 처럼 쓰기 화면 주소 뒤에 붙는 것
   · 휴대폰 폭(≤640px)은 예전처럼 같은 화면 · 창이 막히면(팝업 차단) 같은 화면으로
   · Ctrl·Shift·가운데 단추 누르기는 브라우저 기본(새 탭 등) 그대로
   · 쓰기 창은 주소에 win=1 → 위 머리·도구 줄 숨김 · 보내기·예약·취소 뒤 창이 저절로 닫힘(mail_compose.html cmpGo) */
if(!window.mailNewWin) window.mailNewWin=function(ev, q){
  if(ev && (ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.button===1)) return true;
  var plain='/mail/compose'+(q ? '?'+q : '');
  var narrow=false; try{ narrow=window.matchMedia('(max-width:640px)').matches; }catch(e){}
  if(narrow){ location.href=plain; return false; }
  var sw=screen.availWidth||1280, sh=screen.availHeight||900;
  var w=Math.min(1100, sw-40), h=Math.min(960, sh-40);
  var l=Math.max(0, Math.round((sw-w)/2)), t=Math.max(0, Math.round((sh-h)/2));
  var win=null;
  try{ win=window.open(plain+(q ? '&' : '?')+'win=1', 'knkmail_new_'+Date.now(), 'popup=yes,width='+w+',height='+h+',left='+l+',top='+t); }catch(e){ win=null; }
  if(!win){ location.href=plain; return false; }
  try{ win.focus(); }catch(e){}
  return false;
};
</script>
