<style>

.ex-new[hidden]{display:none !important;}
.ex-sub{font-size:12.5px;color:var(--mute);margin-top:6px;}
.ex-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.ex-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:9px;border:1px solid var(--line,#e5e7eb);background:#fff;color:var(--ink,#0f172a);font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap;}

.ex-btn.pri{background:#15803d;border-color:#15803d;color:#fff;}

.ex-kpi.hot .n{color:#b91c1c;}

.ex-chip.k2{background:#f0fdf4;color:#15803d;border-color:#bbf7d0;}

.ex-ck .d{font-size:11.5px;color:var(--mute);margin-top:2px;}
