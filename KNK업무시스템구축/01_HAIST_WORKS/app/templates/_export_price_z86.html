{# z1191z86 (대표 11-20 「조건을 사용자가 넣을수있게」 · 「알람 울려주고 나서 사용자가 그 벗어난 것도 허용을 할 건지 말 건지를 선택을 받고 다음을 진행」):
   단가가 정한 범위를 벗어난 줄 — 줄마다 「허용(까닭)」 또는 「고치기」 · ① 자동 채움 결과 카드와 선적 건 화면이 같이 쓴다 #}
<style>
.xp-box { margin-top:10px; border:1px solid #fdba74; border-radius:10px; background:#fffaf3; padding:10px 12px; }
.xp-box.done { border-color:#86efac; background:#f6fef9; }
.xp-head { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:12.5px; color:#7c2d12; }
.xp-box.done .xp-head { color:#166534; }
.xp-head b.n { font-size:14px; }
.xp-rule { font-size:11.5px; color:#6b7280; }
.xp-rule a { color:#1d4ed8; }
.xp-bulk { margin-left:auto; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.xp-tbl { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
.xp-tbl th { text-align:left; font-size:10.5px; color:#9a3412; background:#fff1e0; padding:5px 7px; border-bottom:1px solid #fdba74; position:sticky; top:0; }
.xp-tbl td { padding:5px 7px; border-bottom:1px solid #fbe7cf; vertical-align:middle; }
.xp-tbl td.num, .xp-tbl th.num { text-align:right; white-space:nowrap; }
.xp-scroll { max-height:380px; overflow:auto; }
.xp-up { color:#b91c1c; font-weight:700; } .xp-down { color:#1d4ed8; font-weight:700; }
.xp-sel { font-size:11.5px; padding:3px 4px; border:1px solid #d6d3d1; border-radius:6px; max-width:190px; }
.xp-b { font-size:11.5px; padding:3px 9px; border-radius:6px; border:1px solid #15803d; background:#15803d; color:#fff; font-weight:700; cursor:pointer; white-space:nowrap; }
.xp-b.fix { border-color:#b45309; background:#fff; color:#b45309; }
.xp-b.ghost { border-color:#d6d3d1; background:#fff; color:#374151; font-weight:600; }
.xp-b:disabled { opacity:.5; cursor:default; }
.xp-ok { color:#166534; font-weight:700; font-size:11.5px; } .xp-fix { color:#b45309; font-weight:700; font-size:11.5px; }
.xp-who { font-size:10.5px; color:#9ca3af; }
.xp-msg { font-size:11.5px; }
.xp-dl-off { opacity:.55; pointer-events:none; }
</style>
<script>
(function(){
  if(window.XP) return;
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(ch){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]; }); }
  function money(v){ return v == null ? '' : Number(v).toLocaleString('en-US', {maximumFractionDigits: 4}); }
  function pk(v){ return (Math.round(Number(v) * 10000) / 10000).toFixed(4); }
  function groups(rows){
    var g = [], at = {};
    rows.forEach(function(p){
      var k = p.key + '|' + pk(p.now);
      if(!(k in at)){ at[k] = g.length; g.push({p: p, lines: []}); }
      if(p.row != null) g[at[k]].lines.push(p.row);
    });
    return g;
  }
  function counts(rows){
    var n = {open:0, allow:0, fix:0};
    groups(rows).forEach(function(x){ n[x.p.decision || 'open']++; });
    return n;
  }
  function reasonSel(reasons, cls){
    return '<select class="xp-sel ' + (cls || '') + '"><option value="">허용 까닭 고르기…</option>'
      + reasons.map(function(r){ return '<option>' + esc(r) + '</option>'; }).join('') + '<option value="__own">직접 적기…</option></select>';
  }
  function pickReason(sel){
    var v = sel ? sel.value : '';
    if(v === '__own'){ v = (prompt('허용하는 까닭을 적어 주세요') || '').trim(); }
    return v;
  }
  /* el 에 그린다 · o = {no, rows, rule, kind, reasons, onChange(n), thumb(p)} — rows 는 같은 배열을 고친다(카드를 다시 그려도 고른 것이 남게)
     · thumb = 지난 수출 사진 칸(① 화면 · z1191r) · 줄에 n(지난 번 수)이 있으면 「지난 범위(번)」 칸도 */
  function render(el, o){
    var rows = o.rows || [], reasons = o.reasons || [], n = counts(rows), gs = groups(rows);
    if(!rows.length){ el.innerHTML = ''; el.className = el.className.replace(/\s*xp-box\b/, ''); return n; }
    if(!/\bxp-box\b/.test(el.className)) el.className += ' xp-box';
    el.classList.toggle('done', !n.open);
    var h = '<div class="xp-head">💲 <span>단가가 <b>정한 범위</b>를 벗어난 줄 <b class="n">' + gs.length + '</b>개'
      + (n.open ? ' — <b>남은 고르기 ' + n.open + '</b>' : ' — 모두 골랐습니다') + '</span>'
      + '<span class="xp-rule">조건: ' + esc((o.kind ? o.kind + ' · ' : '') + (o.rule || '')) + ' · 지난번 수출 단가와 비교 · <a href="/export/rules" target="_blank" rel="noopener">⚙ 조건 바꾸기</a></span>';
    if(n.open > 1){
      h += '<span class="xp-bulk">' + reasonSel(reasons, 'xp-all') + '<button type="button" class="xp-b xp-allb">남은 ' + n.open + '줄 모두 허용</button></span>';
    }
    h += '</div>';
    if(!o.no){ h += '<div class="xp-msg" style="color:#b91c1c;margin-top:6px;">인보이스 번호를 읽지 못한 파일이라 고른 것을 남길 수 없습니다 — 번호를 적은 파일로 다시 올려 주세요</div>'; }
    h += '<div class="xp-sub" style="font-size:11.5px;color:#7c2d12;margin-top:4px;">본사↔법인 거래라 베트남 세관이 단가를 봅니다 — 맞는 값이면 <b>허용</b>(까닭), 잘못 적은 값이면 <b>고치기</b>(엑셀에서 고쳐 다시 올림).' + (n.open ? ' 고르기 전에는 채운 파일을 받을 수 없습니다.' : '') + '</div>';
    var withLines = gs.some(function(x){ return x.lines.length; }),
        withImg = !!o.thumb && gs.some(function(x){ return x.p.img; }), withRange = gs.some(function(x){ return x.p.n; });
    h += '<div class="xp-scroll"><table class="xp-tbl"><thead><tr>' + (withLines ? '<th>줄</th>' : '') + (withImg ? '<th>지난 사진</th>' : '')
      + '<th>규격(Description)</th><th class="num">이번 단가</th><th class="num">지난번</th><th class="num">차이</th><th>지난 인보이스</th>'
      + (withRange ? '<th class="num">지난 범위(번)</th>' : '') + '<th>고르기</th></tr></thead><tbody>';
    gs.forEach(function(x, i){
      var p = x.p, cell;
      if(p.decision === 'allow'){
        cell = '<span class="xp-ok">✓ 허용</span> <span style="font-size:11.5px;">' + esc(p.reason) + '</span><div class="xp-who">' + esc(p.by_name || '') + ' ' + esc(p.at || '') + ' · <a href="#" data-i="' + i + '" class="xp-undo">바꾸기</a></div>';
      } else if(p.decision === 'fix'){
        cell = '<span class="xp-fix">✎ 고치기</span> <span style="font-size:11.5px;">엑셀에서 단가를 고쳐 다시 올려 주세요</span><div class="xp-who">' + esc(p.by_name || '') + ' ' + esc(p.at || '') + ' · <a href="#" data-i="' + i + '" class="xp-undo">바꾸기</a></div>';
      } else {
        cell = '<span style="display:inline-flex;gap:4px;flex-wrap:wrap;align-items:center;">' + reasonSel(reasons) + '<button type="button" class="xp-b xp-allow" data-i="' + i + '">허용</button>'
          + '<button type="button" class="xp-b fix xp-fixb" data-i="' + i + '">고치기</button></span>';
      }
      h += '<tr>' + (withLines ? '<td class="num" style="font-size:11px;">' + esc(x.lines.slice(0, 6).join(', ') + (x.lines.length > 6 ? '…' : '')) + '</td>' : '')
        + (withImg ? '<td>' + (p.img ? o.thumb(p) : '') + '</td>' : '')
        + '<td>' + esc(p.desc) + '</td><td class="num">' + money(p.now) + '</td><td class="num">' + money(p.last) + '</td>'
        + '<td class="num ' + (p.diff > 0 ? 'xp-up' : 'xp-down') + '">' + (p.diff > 0 ? '+' : '') + p.diff + '%</td>'
        + '<td style="font-size:11.5px;">' + esc(p.last_inv || '') + '<div class="xp-who">' + esc(p.last_date || '') + '</div></td>'
        + (withRange ? '<td class="num" style="font-size:11.5px;">' + (p.n ? money(p.min) + (p.max !== p.min ? ' ~ ' + money(p.max) : '') + ' (' + p.n + ')' : '') + '</td>' : '')
        + '<td>' + cell + '</td></tr>';
    });
    h += '</tbody></table></div><div class="xp-msg"></div>';
    el.innerHTML = h;
    var msg = el.querySelector('.xp-msg:last-child');
    async function send(list, dec, reason){
      if(!o.no){ return; }
      var bs = el.querySelectorAll('button'); Array.prototype.forEach.call(bs, function(b){ b.disabled = true; });
      msg.textContent = '저장하는 중…';
      try {
        var r = await fetch('/export/price-ack', {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({invoice_no: o.no, items: list.map(function(x){ var p = x.p;
            return {key: p.key, now: p.now, desc: p.desc, last: p.last, last_inv: p.last_inv, diff: p.diff, decision: dec, reason: reason}; })})});
        var j = await r.json().catch(function(){ return {ok:false, error:'응답을 읽지 못했습니다(' + r.status + ')'}; });
        if(!j.ok){ msg.innerHTML = '<span style="color:#b91c1c;">' + esc(j.error || '저장하지 못했습니다') + '</span>'; Array.prototype.forEach.call(bs, function(b){ b.disabled = false; }); return; }
        var got = {};
        (j.items || []).forEach(function(a){ got[a.key + '|' + a.now] = a; });
        rows.forEach(function(p){ var a = got[p.key + '|' + pk(p.now)]; if(a){ p.decision = a.decision; p.reason = a.reason; p.at = a.at; p.by_name = a.by_name; } });
        var nn = render(el, o);
        if(o.onChange) o.onChange(nn);
      } catch(e){ msg.innerHTML = '<span style="color:#b91c1c;">통신이 끊겼습니다 — ' + esc(e) + '</span>'; Array.prototype.forEach.call(bs, function(b){ b.disabled = false; }); }
    }
    el.onclick = function(ev){
      var t = ev.target, i = t.dataset ? +t.dataset.i : NaN;
      if(t.classList.contains('xp-allow')){
        var why = pickReason(t.parentNode.querySelector('select'));
        if(!why){ msg.innerHTML = '<span style="color:#b45309;">허용하는 까닭을 먼저 골라 주세요</span>'; return; }
        send([gs[i]], 'allow', why);
      } else if(t.classList.contains('xp-fixb')){
        send([gs[i]], 'fix', '');
      } else if(t.classList.contains('xp-allb')){
        var w = pickReason(el.querySelector('select.xp-all'));
        if(!w){ msg.innerHTML = '<span style="color:#b45309;">허용하는 까닭을 먼저 골라 주세요</span>'; return; }
        var left = gs.filter(function(x){ return !x.p.decision; });
        if(!confirm('남은 ' + left.length + '줄을 「' + w + '」 까닭으로 모두 허용합니다. 맞습니까?')) return;
        send(left, 'allow', w);
      } else if(t.classList.contains('xp-undo')){
        ev.preventDefault();
        send([gs[i]], '', '');
      }
    };
    return n;
  }
  window.XP = {render: render, counts: counts};
})();
</script>
